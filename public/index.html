  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }
    .brand-shark {
      width: 30px; height: 30px; vertical-align: -7px; margin-right: 9px;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 20px; font-weight: 700; color: #58a6ff; }
    header span { font-size: 12px; color: #8b949e; }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 20px 24px 0;
      border-bottom: 1px solid #30363d;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 20px;
      border-radius: 6px 6px 0 0;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: transparent;
      color: #8b949e;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; background: #161b22; }
    .tab:hover:not(.active) { color: #e6edf3; }
    .controls {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary { background: #238636; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    .refresh-info { font-size: 12px; color: #8b949e; }

    .arb-alert {
      background: linear-gradient(90deg, #1a0a2e 0%, #2d1b4e 100%);
      border: 1px solid #8b5cf6;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 0 24px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .arb-alert-icon { font-size: 24px; }
    .arb-alert-text { flex: 1; }
    .arb-alert-title { font-weight: 700; color: #a78bfa; font-size: 14px; }
    .arb-alert-desc { font-size: 12px; color: #c4b5fd; margin-top: 2px; }
    .arb-profit { font-size: 18px; font-weight: 800; color: #10b981; }

    .content { padding: 0 24px 24px; }
    .loading { text-align: center; padding: 60px; color: #8b949e; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      background: #1a0a0a;
      border: 1px solid #6e1010;
      border-radius: 8px;
      padding: 16px;
      color: #f85149;
    }
    .games-grid {
      display: grid;
      /* min(420px, 100%), not a bare 420px. A bare minimum is a FLOOR, so on
         any container narrower than it — every phone, and the Pick 6 holder
         that was being squeezed by its own spinner — the column stayed 420
         wide and pushed out past the edge. Measured at a 564px viewport: a
         381px grid holding a 420px card. */
      grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr));
      gap: 16px;
    }
    .game-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .game-card:hover { border-color: #58a6ff44; }
    .game-card.value-bet { border-color: #2ea04388; }
    .card-header {
      background: #1c2128;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .teams { font-size: 15px; font-weight: 700; }
    .game-time { font-size: 12px; color: #8b949e; margin-top: 4px; }
    .header-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .rank-badge {
      display: inline-block;
      background: #388bfd22;
      color: #58a6ff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 4px;
    }
    .card-body { padding: 14px 16px; }

    .pool-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pool-table th {
      text-align: left; padding: 8px 6px; border-bottom: 1px solid #30363d;
      color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase;
    }
    .pool-table td { padding: 7px 6px; border-bottom: 1px solid #21262d; }
    .pool-table input {
      width: 62px; background: #0d1117; color: #c9d1d9;
      border: 1px solid #30363d; border-radius: 4px; padding: 4px 6px; font-size: 13px;
    }
    .pool-table input:focus { outline: none; border-color: #58a6ff; }
    .pool-market { color: #8b949e; font-variant-numeric: tabular-nums; }
    .pool-pick {
      background: #161b22; border: 1px solid #30363d; border-left: 3px solid #58a6ff;
      border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
    }
    .pool-pick.strong { border-left-color: #3fb950; }
    .pool-pick .headline { font-weight: 700; font-size: 15px; }
    .pool-pick .detail { color: #8b949e; font-size: 12px; margin-top: 3px; }
            .pool-block-off { border-left-color: #30363d !important; color: #6e7681; font-size: 11px; }
    .pool-block { background: #10151c; border-left: 3px solid #58a6ff; border-radius: 4px;
                  padding: 8px 10px; margin-bottom: 10px; }
    .pool-block-head { font-size: 13px; color: #8b949e; }
    .pool-block-head strong { color: #c9d1d9; font-size: 14px; margin-left: 4px; }
    .pool-block-prob { color: #58a6ff; font-weight: 700; margin-left: 6px; }
    .pool-block-line { font-size: 11px; color: #8b949e; margin-top: 3px; }
    .pool-block-line strong { color: #58a6ff; }
    .pool-block-note { font-size: 11px; color: #d29922; margin-top: 3px; }
    .pick-analysis { margin-top: 6px; }
    .pa-box > summary { cursor: pointer; font-size: 11px; color: #58a6ff; list-style: none; }
    .pa-box > summary::-webkit-details-marker { display: none; }
    .pa-box > summary::before { content: '\25B8'; display: inline-block;
                                width: 12px; transition: transform 0.12s; }
    .pa-box[open] > summary::before { transform: rotate(90deg); }
    .pa-row { display: flex; gap: 8px; margin-top: 5px; font-size: 11px; line-height: 1.45; }
    .pa-key { flex: 0 0 96px; color: #6e7681; text-transform: uppercase;
              letter-spacing: 0.4px; font-size: 10px; padding-top: 1px; }
    .pa-val { color: #a8b1ba; }
    .pa-caveat { color: #6e7681; font-style: italic; }
    .pa-agree { color: #3fb950; }
    .pa-flag { color: #d29922; }
    .pool-inj { font-size: 10px; margin-top: 2px; line-height: 1.3; }
    .inj-plain { color: #6e7681; }
    .inj-heavy { color: #d29922; font-weight: 600; }
    .inj-base { color: #484f58; }
    .pool-track { font-size: 10px; color: #8b949e; margin-top: 2px; line-height: 1.3; }
    .pool-moved { font-size: 10px; color: #6e7681; margin-top: 2px; line-height: 1.3; }
    .pool-moved.big { color: #58a6ff; }
    .pool-moved.none { color: #484f58; font-style: italic; }
    .share-state { margin-top: 8px; font-size: 11px; }
    .share-on { color: #3fb950; }
    .share-off { color: #d29922; }
    .card-odds { background: #10151c; border: 1px solid #21262d; border-left: 3px solid #58a6ff;
                 border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
    .card-headline { font-size: 14px; color: #c9d1d9; }
    .card-headline strong { color: #58a6ff; }
    .card-sub { color: #6e7681; font-size: 12px; }
    .card-line { font-size: 11px; color: #8b949e; margin-top: 4px; }
    .card-warn { color: #d29922; }
    .pool-note {
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 12px 14px; margin-bottom: 14px; color: #8b949e; font-size: 12px; line-height: 1.5;
    }
    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1c3a5e;
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .lines-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .line-item { flex: 1; min-width: 70px; }
    .line-label { font-size: 10px; color: #8b949e; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
    .line-value { font-size: 15px; font-weight: 700; }
    .verdict {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      padding: 9px 11px; border-radius: 6px; margin-bottom: 10px;
      background: #161b22; border: 1px solid #30363d; border-left: 3px solid #6e7681;
    }
    /* Two things are colour-coded here, and they must never be confused.
       GREEN is a price advantage: the book is offering a better number than
       the market, which is a fact about what is on offer. BLUE is a lean: no
       price advantage, just the projection and the situation agreeing, and the
       projection has been measured at 0.35 points per game worse than the
       closing line. Green means bet. Blue means "if you are betting anyway".
       Grey means neither, which is most games.

       `edge`/`slight`/`lean`/`coinflip`/`pass` come from bestBet, and
       `strong`/`none` from the older betRecommendation the interface still
       falls back to. Both sets are covered, because a level with no rule
       silently renders as grey - which is how Best bet came to look exactly
       like No lean. */
    .verdict.edge,
    .verdict.strong   { border-left-color: #3fb950; background: #0f2a1a; }
    .verdict.slight   { border-left-color: #3fb950; }
    .verdict.lean     { border-left-color: #58a6ff; }
    .verdict.coinflip,
    .verdict.none     { border-left-color: #6e7681; }
    /* Priced but not advised: amber, because it is neither a recommendation
       nor nothing — the numbers are real and the advice is being held back. */
    .verdict.withheld { border-left-color: #d29922; }
    .verdict.pass     { border-left-color: #6e7681; opacity: 0.75; }

    .verdict-label { font-weight: 800; font-size: 14px; }
    .verdict.edge .verdict-label,
    .verdict.strong .verdict-label { color: #3fb950; }
    .verdict.slight .verdict-label { color: #56d364; }
    .verdict.lean .verdict-label   { color: #58a6ff; }
    .verdict.withheld .verdict-label { color: #d29922; }
    .verdict.coinflip .verdict-label,
    .verdict.none .verdict-label,
    .verdict.pass .verdict-label   { color: #8b949e; }

    .verdict-pick { font-weight: 800; font-size: 15px; color: #c9d1d9; }
    .verdict-caveat { font-size: 11px; color: #8b949e; font-style: italic; margin-top: 4px; }
    .verdict-reason { font-size: 12px; color: #8b949e; }
    /* Sits inline beside the pick when closed, so a best bet is one line and
       a toggle. The separator only earns its place once there is something

</head>
