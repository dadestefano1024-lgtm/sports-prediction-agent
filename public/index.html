  <script>
    let currentSport = 'nba';

    // Which football week is on screen.
    //
    // Football is eighteen fixed weeks, not a rolling date window, and the
    // whole fixture list exists months ahead with numbers already posted on it.
    // null means "whatever the server thinks is current" — it resolves that
    // itself, and gets it right during preseason, when ESPN's own answer is a
    // preseason week number that shares a name with a real one.
    let nflWeek = null;
    let nflWeeks = 18;
    let cache = {};

    // Auto-refresh budget. The Odds API free tier is 500 requests/month and each
    // prediction fetch costs ~3, so an uncapped loop in a tab left open all day
    // would drain the entire month in well under 24 hours. Refresh now skips
    // while the tab is hidden and stops after AUTO_REFRESH_MAX cycles; clicking
    // Fetch Predictions resets the budget.
    const AUTO_REFRESH_MS = 15 * 60 * 1000;
    const AUTO_REFRESH_MAX = 8;
    let autoRefreshCount = 0;
    let autoRefreshTimer = null;

    function scheduleAutoRefresh(sportOfLastFetch) {
      clearTimeout(autoRefreshTimer);
      if (autoRefreshCount >= AUTO_REFRESH_MAX) {
        document.getElementById('refresh-info').textContent =
          'Auto-refresh paused to protect API quota. Click Fetch Predictions to resume.';
        return;
      }
      autoRefreshTimer = setTimeout(() => {
        if (currentSport !== sportOfLastFetch) return;
        // Hidden tab: reschedule without spending a request.
        if (document.hidden) { scheduleAutoRefresh(sportOfLastFetch); return; }
        autoRefreshCount++;
        fetchPredictions(true);
      }, AUTO_REFRESH_MS);
    }
    let historyFilter = null; // null = all, 'nba', 'nhl', 'mlb'

    function switchTab(sport, el) {
      currentSport = sport;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');

      const fetchBtn = document.getElementById('fetch-btn');
      const refreshInfo = document.getElementById('refresh-info');

      if (sport === 'pool') {
        fetchBtn.style.display = 'none';
        refreshInfo.textContent = 'Score your pool lines against the current market';
        loadPool();
        return;
      }

      if (sport === 'history') {
        // History tab: hide the fetch button, load history immediately
        fetchBtn.style.display = 'none';
        refreshInfo.textContent = 'Pick history and W/L tracking';
        loadHistory();
        return;
      }

      // Sport tab: show the fetch button
      fetchBtn.style.display = '';
      refreshInfo.textContent = 'Click to load predictions with live betting lines';

      if (cache[sport]) {
        renderGames(cache[sport]);
      } else {
        document.getElementById('content').innerHTML = '<div class="no-games">Click Fetch Predictions to load ' + sport.toUpperCase() + ' data.</div>';
      }
    }

    async function fetchPredictions(isAuto) {
      // A manual click resets the auto-refresh budget; an auto cycle does not.
      if (!isAuto) { autoRefreshCount = 0; }
      const btn = document.getElementById('fetch-btn');
      const info = document.getElementById('refresh-info');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      info.textContent = 'Fetching live data & running predictions...';

      document.getElementById('content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>Analyzing ${currentSport.toUpperCase()} games with live odds...</div>
        </div>`;

      try {
        const res = await fetch('/api/predictions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sport: currentSport,
            // Football is asked for by week; the daily sports have no week to
            // send and the server ignores the field for them.
            ...(currentSport === 'nfl' && nflWeek ? { week: nflWeek } : {}),
          })
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // DEBUG: Log the full response
        console.log('API Response:', data);
        if (data.games && data.games.length > 0) {
          console.log('First game:', data.games[0]);
          console.log('Line movement:', data.games[0].lineMovement);
          console.log('Sharp signals:', data.games[0].sharpSignals);
        }

        cache[currentSport] = data;
        renderGames(data);
        document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
        info.textContent = `Loaded ${data.games?.length || 0} games`;

        scheduleAutoRefresh(data.sport?.toLowerCase());

      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
        info.textContent = 'Error loading data. Try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch Predictions';
      }
    }

    function safeNum(val) {
      const num = parseFloat(val);
      return isNaN(num) ? null : num;
    }

    function formatEdge(val) {
      if (val === null || val === undefined) return 'N/A';
      const num = parseFloat(val);
      if (isNaN(num)) return 'N/A';
      return (num > 0 ? '+' : '') + num.toFixed(1) + '%';
    }

    function formatKelly(val) {
      if (val === null || val === undefined) return '0%';
      const num = parseFloat(val);
      if (isNaN(num)) return '0%';
      return num.toFixed(1) + '%';
    }

    function edgeClass(val) {
      const num = safeNum(val);
      if (num === null) return 'neutral';
      if (num > 1) return 'positive';
      if (num < -1) return 'negative';
      return 'neutral';
    }

    // A card is worth flagging when the book being bet at is offering a better
    // NUMBER than the rest of the market. That is a fact about prices. The old
    // version flagged a model edge of 3% or more, which after measurement is
    // noise dressed as a recommendation.
    function hasBookValue(game) {
      return Number(game.bookValuePts || 0) > 0;
    }

    // Format a single number for the movement table — handles null, plus signs, etc.
    function fmtNum(val, withPlus) {
      if (val === null || val === undefined || isNaN(val)) return '—';
      const num = parseFloat(val);
      if (withPlus && num > 0) return '+' + num;
      return String(num);
    }

    // Format a movement value with color and arrow
    // The server runs in UTC, so anything it formats is on the wrong date for
    // most readers — a 6pm kickoff came back as tomorrow. Format from the raw
    // ISO instead; the browser knows the timezone and the server never can.
    function fmtKickoff(game) {
      const iso = game.startTime;
      if (!iso) return game.gameTime || '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return game.gameTime || '';
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      return sameDay ? `Today ${time}`
        : `${d.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' })} ${time}`;
    }

    function fmtMovement(val) {
      // Unknown and unmoved are different facts. Showing "no move" for a
      // missing opening line is how a broken feed reads as a real measurement.
      if (val === null || val === undefined || isNaN(val)) {
        return { text: 'n/a', cls: 'move-flat' };
      }
      if (val === 0) {
        return { text: 'no move', cls: 'move-flat' };
      }
      const num = parseFloat(val);
      if (num > 0) return { text: '↑ +' + num.toFixed(1), cls: 'move-up' };
      return { text: '↓ ' + num.toFixed(1), cls: 'move-down' };
    }

    // ========================================================================
    // NEW: Render the full-detail line movement section
    // Shows: market | open | current | movement, plus sharp signals below
    // ========================================================================
    // The odds board replaced this.
    //
    // Both showed the same thing — a spread and a total, open against current —
    // and after the board arrived the card printed it twice, from two different
    // books, with two different attributions: the board headed "DraftKings"
    // from ESPN's feed, this table headed "via LowVig.ag" from whichever book
    // The Odds API happened to have the best price at. Two provenances for one
    // fact is worse than either alone, because the reader cannot tell which
    // number they are actually being offered.
    //
    // The board wins: it carries the PRICE beside each number, it is one book
    // end to end, and it highlights whatever moved. The only thing lost is an
    // explicit "no move" row, and a number that is the same in both columns
    // already says that.
    function renderLineMovement() { return ''; }


    // Where a game sits in the list. Anything the app will actually stand
    // behind goes first; everything else keeps its kickoff order underneath.
    // withheld sits below the actionable verdicts and above silence: it has
    // something to say — a priced number and a reason it is not being acted on
    // — which is more than a card with no verdict at all.
    const VERDICT_ORDER = { edge: 0, strong: 0, slight: 1, lean: 2, withheld: 3 };
    function verdictRank(g) {
      const r = g.bestBet || g.recommendation;
      const rank = r ? VERDICT_ORDER[r.level] : undefined;
      return rank === undefined ? 9 : rank;
    }

    /**
     * The NFL card list — and, with options, the Pick 6 list too.
     *
     * Danny asked for the Pick 6 to look exactly like this tab, with the pool
     * arithmetic added. The honest way to give him that is to render the SAME
     * cards rather than build a second set that drifts: a weather badge fixed
     * here would otherwise have to be fixed twice, and the reason the two tabs
     * disagreed about everything from injuries to line movement is that they
     * were never the same code.
     *
     *   onlyIds  — render just these games, in this order
     *   extraFor — html injected at the top of each card body, which is where
     *              the pool block goes
     *   target   — element to write into
     *   header   — html before the grid
     */
    function renderGames(data, opts = {}) {
      let games = data.games || [];
      const targetEl = document.getElementById(opts.target || 'content');

      if (opts.onlyIds) {
        const order = [...opts.onlyIds];
        const byId = {};
        for (const g of games) if (g.id) byId[g.id] = g;
        games = order.map(id => byId[id]).filter(Boolean);
      }

      if (!games.length) {
        targetEl.innerHTML = '<div class="no-games">No games found for today.</div>';
        return;
      }

      // Sorted, not filtered: every game is still here, the ones worth acting
      // on are just at the top instead of scattered down a fifteen-game card.
      // Stable within a rank, so kickoff order survives underneath.
      const ordered = opts.onlyIds ? games : games
        .map((g, i) => ({ g, i, rank: verdictRank(g) }))
        .sort((a, b) => a.rank - b.rank || a.i - b.i)
        .map(x => x.g);

      if (data.week && !opts.onlyIds) { nflWeek = data.week; nflWeeks = data.weeks || nflWeeks; }
      const html = ordered.map(g => {
        const valueBet = hasBookValue(g);

        let weatherBadge = '';
        if (g.weather) {
          weatherBadge = `<span class="weather-badge">🌡️ ${g.weather.temperature}°F ${g.weather.windSpeed}mph</span>`;
        }

        const favoriteTeam = g.favorite || '';
        const homeIsFavorite = favoriteTeam.includes(g.homeTeam?.split(' ').pop());

        // NEW: Full-detail line movement section (replaces old movementHTML)
        const movementHTML = renderLineMovement(g);

        // THE ODDS BOARD — what the number opened at, and what it is now.
        //
        // This replaces two things that were not earning their space.
        //
        // The first compared the book being bet at against the consensus of
        // nine others and printed "at market" underneath. It said "at market"
        // on every game, which is not a bug: DraftKings is a market-maker, and
        // measured against the median of eight other books it came out WORSE
        // on ten of sixteen baseball quotes and never better by even half a
        // point. Telling somebody with one account that their one account
        // matches the market, on every game forever, is a row of pixels
        // reporting nothing they can act on.
        //
        // The second printed a fair price derived from the moneyline. That
        // arithmetic still runs — it is what produces the verdict on baseball —
        // but a reader does not need the working shown on every card to use the
        // one-line answer above it.
        //
        // What replaces them is what a sportsbook actually shows: opening
        // number, current number, and the price beside each. Every figure is a
        // fact about what was and is on offer, nothing is derived, and the
        // movement between the two columns is the input to the only edge here
        // that has ever survived a holdout test.
        let linesHTML = '';
        {
          const b = (g.lineMovement && g.lineMovement.board) || null;
          const shortName = (full) => (full || '').split(' ').pop();
          const px = (n) => (n === null || n === undefined) ? ''
            : `${n > 0 ? '+' : ''}${n}`;
          const pts = (n) => (n === null || n === undefined) ? '—'
            : `${n > 0 ? '+' : ''}${n}`;

          // A cell is the number and, under it, what that number costs.
          const cell = (line, price, moved) =>
            `<div class="ob-cell${moved ? ' ob-moved' : ''}">` +
            `<span class="ob-num">${line}</span>` +
            `<span class="ob-px">${price === '' ? '&nbsp;' : price}</span></div>`;

          if (b && (b.open || b.current)) {
            const o = b.open || {}, c = b.current || {};
            const changed = (a, z) => a !== null && a !== undefined &&
                                      z !== null && z !== undefined && a !== z;

            // Your frozen number sits BETWEEN open and current, because that is
            // where it sits in time — the market opened, the pool posted its
            // card, the market kept going. Reading left to right is then the
            // week in order, and the two gaps either side of the middle column
            // are the two different things that were being confused all week:
            // how far the market has travelled, and how much of it you are
            // holding.
            const mine = opts.poolFor ? opts.poolFor(g) : null;
            const row = (label, oLine, oPx, cLine, cPx, myLine) => `
              <div class="ob-row">
                <div class="ob-label">${label}</div>
                ${cell(oLine, oPx, false)}
                ${mine ? `<div class="ob-cell ob-mine"><span class="ob-num">${
                  myLine === null || myLine === undefined ? '&mdash;' : myLine
                }</span><span class="ob-px">&nbsp;</span></div>` : ''}
                ${cell(cLine, cPx, changed(oLine, cLine) || changed(oPx, cPx))}
              </div>`;

            linesHTML = `
              <div class="ob">
                <div class="ob-head${mine ? ' ob-head3' : ''}">
                  <div class="ob-label">${b.book || 'Odds'}</div>
                  <div class="ob-col">Open</div>
                  ${mine ? '<div class="ob-col ob-mine-col">Pick 6</div>' : ''}
                  <div class="ob-col">Current</div>
                </div>
                ${row(shortName(g.awayTeam),
                      pts(o.awaySpread), px(o.awaySpreadPrice),
                      pts(c.awaySpread), px(c.awaySpreadPrice),
                      mine ? pts(mine.awaySpread) : null)}
                ${row(shortName(g.homeTeam),
                      pts(o.homeSpread), px(o.homeSpreadPrice),
                      pts(c.homeSpread), px(c.homeSpreadPrice),
                      mine ? pts(mine.spread) : null)}
                ${row('Over',
                      o.total ?? '—', px(o.overPrice),
                      c.total ?? '—', px(c.overPrice),
                      mine ? (mine.total ?? '—') : null)}
                ${row('Under',
                      o.total ?? '—', px(o.underPrice),
                      c.total ?? '—', px(c.underPrice),
                      mine ? (mine.total ?? '—') : null)}
                ${row('Moneyline',
                      `${px(o.awayML) || '—'} / ${px(o.homeML) || '—'}`, '',
                      `${px(c.awayML) || '—'} / ${px(c.homeML) || '—'}`, '',
                      mine ? '—' : null)}
              </div>`;
          } else {
            // No opening numbers for this game. Show what there is rather than
            // an empty box.
            linesHTML = `
              <div class="ob">
                <div class="ob-head">
                  <div class="ob-label">Current</div>
                  <div class="ob-col">Spread</div>
                  <div class="ob-col">Total</div>
                </div>
                <div class="ob-row">
                  <div class="ob-label">&nbsp;</div>
                  ${cell(pts(g.spread), '', false)}
                  ${cell(g.total ?? '—', '', false)}
                </div>
                <div class="ob-row">
                  <div class="ob-label">Moneyline</div>
                  ${cell(px(g.awayML) || '—', shortName(g.awayTeam), false)}
                  ${cell(px(g.homeML) || '—', shortName(g.homeTeam), false)}
                </div>
              </div>`;
          }
        }

        // No edge chips, no Kelly sizing, no pick chips.
        //
        // Those numbers were real arithmetic, but the input behind them has
        // been tested three ways — opponent-adjusted points, yards per play and
        // EPA — and all three come out indistinguishable from simply taking the
        // market price. Sizing a bet off that, or labelling it a "value bet",
        // asserts an advantage that does not survive measurement.
        //
        // What remains on this tab is information that is true: the number at
        // the book being used, how it compares with the rest of the market, how
        // far the line has moved, injuries, quarterback and weather. The one
        // place that still recommends anything is the Pick 6 tab, where the
        // edge comes from a stale line rather than a forecast.
        const factors = (g.keyFactors || []).map(f => `<div class="factor-item">${f}</div>`).join('');

        // INJURY REPORT — collapsed by default.
        //
        // It used to print every player on both sides inline, which on a
        // baseball card is twenty-odd rows and buries everything else. Now the
        // headline is a one-line count and the names are behind a disclosure
        // triangle, so a card stays readable and the detail is one tap away.
        //
        // Long-term absences sit at the bottom and are dimmed. A player on the
        // 60-day IL has been out for months and is in every price already; the
        // useful part of this report is who is newly unavailable.
        let injuriesHTML = '';
        {
          const home = (g.stats && g.stats.injuries && g.stats.injuries.home) || [];
          const away = (g.stats && g.stats.injuries && g.stats.injuries.away) || [];

          if (g.injuriesKnown === false) {
            // Say the report could not be fetched. An empty box reads as "both
            // teams are healthy", which is a different and much more useful
            // claim than the one the app can actually make.
            injuriesHTML = `
              <details class="inj-box">
                <summary class="inj-summary">🏥 Injuries <span class="inj-counts inj-quest">report unavailable</span></summary>
                <div class="inj-body"><div class="inj-row"><span class="inj-name">
                  The injury feed did not answer for this league, so nobody is listed here &mdash;
                  which is not the same as nobody being hurt.
                </span></div></div>
              </details>`;
          } else if (home.length || away.length) {
            const isOut = (i) => i.level === 'out' && !i.longTerm;
            const isDoubt = (i) => i.level === 'doubtful';
            const all = home.concat(away);
            const outNow = all.filter(isOut).length;
            const doubtful = all.filter(isDoubt).length;
            const questionable = all.filter(i => i.level === 'questionable').length;
            const longTerm = all.filter(i => i.longTerm).length;

            // Say what is actually news, and only mention the rest as a count.
            const bits = [];
            if (outNow) bits.push(`<span class="inj-out">${outNow} out</span>`);
            if (doubtful) bits.push(`<span class="inj-doubt">${doubtful} doubtful</span>`);
            if (questionable) bits.push(`<span class="inj-quest">${questionable} questionable</span>`);
            if (longTerm) bits.push(`<span class="inj-long">${longTerm} long term</span>`);
            const summary = bits.length ? bits.join(' &middot; ') : 'none listed';

            const row = (i) => {
              const cls = i.longTerm ? 'inj-long' : i.level === 'out' ? 'inj-out'
                : i.level === 'doubtful' ? 'inj-doubt' : 'inj-quest';
              return `<div class="inj-row${i.longTerm ? ' inj-dim' : ''}">` +
                `<span class="inj-status ${cls}">${i.status}</span>` +
                `<span class="inj-name">${i.player}</span>` +
                `<span class="inj-pos">${i.position || ''}</span>` +
                `<span class="inj-type">${i.type || ''}</span></div>`;
            };

            const side = (label, list) => list.length
              ? `<div class="inj-team">${label}</div>${list.map(row).join('')}`
              : '';

            injuriesHTML = `
              <details class="inj-box">
                <summary class="inj-summary">🏥 Injuries <span class="inj-counts">${summary}</span></summary>
                <div class="inj-body">
                  ${side(g.awayTeam, away)}
                  ${side(g.homeTeam, home)}
                </div>
              </details>`;
          }
        }

        return `
          <div class="game-card ${valueBet ? 'value-bet' : ''}">
            <div class="card-header">
              <div>
                <div class="teams">${g.awayTeam} @ ${g.homeTeam}</div>
                <div class="game-time">${
                  g.inProgress ? '<span style="color:#f0883e">● In progress</span> &middot; ' : ''
                }${fmtKickoff(g)}</div>
              </div>
              <div class="header-badges">
                ${weatherBadge}
                ${g.inProgress ? '<span class="confidence Low">live</span>' : ''}
                ${g.bookValuePts > 0
                  ? `<span class="confidence High">+${g.bookValuePts} pt${g.bookValuePts === 1 ? '' : 's'} at ${(g.myBook && g.myBook.name) || 'your book'}</span>`
                  : ''}
              </div>
            </div>
            <div class="card-body">
              ${opts.extraFor ? opts.extraFor(g) : ''}
              ${(() => {
                // Show the best available side, not just whether an edge
                // exists. A lean is styled differently from an edge on purpose:
                // one is a price fact, the other is a tiebreaker for someone
                // betting regardless, and they must not read alike.
                const r = g.bestBet || g.recommendation;
                if (!r) return '';
                // No verdict, no box. "No lean" is an honest answer and it is
                // also the answer on most games, so printing it on every card
                // spends a block of space to say nothing. The flags and pool
                // note below still render on their own when they have
                // something to say; an in-progress game keeps its box, because
                // there it is explaining why the rest of the card is empty.
                // 'withheld' is NOT silent. It is the case where the pricing
                // ran, produced a number, and is deliberately not being acted
                // on — which the reader needs told, or the whole feature is
                // invisible in that sport.
                const silent = r.level === 'coinflip' || r.level === 'none';
                // The pool note sits with the verdict because the two are easy
                // to confuse and mean opposite things: movement is an edge
                // against a frozen line and nothing against a live one.
                // Worded carefully, because it was read as a claim about a
                // pool line that had never been entered. Nothing here knows
                // any pool number. It is reporting that the MARKET spread has
                // moved since it opened, which is only interesting if the
                // number in the pool is still the old one.
                // Suppressed inside the Pick 6 itself. On the live tab it tells a
                // reader to go and compare against their pool number; on this
                // tab the block at the top of the card has already done that,
                // with the actual numbers, so the same sentence becomes an
                // instruction to do something already done.
                // Where the pool's number is actually known, say what it IS
                // rather than what it might be. The hypothetical below only
                // makes sense on a week nobody has entered a card.
                //
                // Assigned, not returned. This sits inside the verdict block's
                // own function, so returning here would have handed back the
                // pool line INSTEAD of the verdict, the situation flags and
                // everything else on the card.
                const realPool = (g.poolPick && !opts.hidePoolFlag) ? (() => {
                  const p = g.poolPick;
                  const shape = p.shape === 'both-lay'
                    ? ` The pool laid points both ways, so a game decided inside ${Math.abs(p.poolLine)} loses whichever side you take.`
                    : '';
                  return `<div class="pool-flag">Pick 6: your line is ${p.poolLine}, the market is
                    ${p.marketLine} &mdash; <strong>${p.gap} pt${p.gap === 1 ? '' : 's'}</strong> of daylight on
                    ${p.pick}, winning ${(p.winProb * 100).toFixed(1)}% if the market number is the truth.${shape}</div>`;
                })() : '';
                // realPool first when it exists, the guess only when it does
                // not. Written as a plain if-chain because the ternary version
                // of this parsed as (realPool || hidden) ? '' : ... — which
                // computed the real line and then threw it away.
                let pf = '';
                if (realPool) pf = realPool;
                else if (!opts.hidePoolFlag && g.poolFlag) pf =
                  `<div class="pool-flag">Pick 6: the market spread has moved ${g.poolFlag.points} pt${g.poolFlag.points === 1 ? '' : 's'} since it opened${
                      g.lineMovement && Number.isFinite(g.lineMovement.openSpread) && Number.isFinite(g.lineMovement.currentSpread)
                        ? ` (${g.lineMovement.openSpread > 0 ? '+' : ''}${g.lineMovement.openSpread} &rarr; ${g.lineMovement.currentSpread > 0 ? '+' : ''}${g.lineMovement.currentSpread})` : ''
                    } — ${g.poolFlag.level === 'strong' ? 'strong candidate if your pool is still on the old number' : 'worth comparing against your pool number'}.</div>`;
                // Situation flags sit with the verdict because they are the
                // reason to look past it: the verdict grades price, a flag says
                // the price may not have caught up with what is known.
                const flags = (g.situationFlags || []).map(f =>
                  `<div class="sit-flag ${f.severity}">${f.note}</div>`).join('');
                if (silent) return `${pf}${flags}`;
                // A verdict that carries its working says everything in there,
                // so the one-line reason and the caveat are dropped rather than
                // printed above it. With the game blurb underneath as well the
                // box was making the same point three times over, and the
                // blurb is the more useful of the three — it names the players
                // and the shape of the game, which no amount of restating the
                // price does.
                //
                // Verdicts WITHOUT working keep their reason: a lean or a
                // withheld price has no other explanation, and stripping the
                // line there would leave a bare label.
                const showsWorking = !!(r.basis && r.basis.length);
                return `<div class="verdict ${r.level}">
                  <span class="verdict-label">${r.label}</span>
                  ${r.pick ? `<span class="verdict-pick">${r.pick}</span>` : ''}
                  ${showsWorking ? '' : `<span class="verdict-reason">${r.reason}</span>`}
                  ${!showsWorking && r.caveat ? `<div class="verdict-caveat">${r.caveat}</div>` : ''}
                  ${basisHTML(r)}
                  ${flags}
                  ${pf}
                </div>`;
              })()}
              ${g.assessment ? `<div class="assessment">${g.assessment}</div>` : ''}
              ${linesHTML}
              ${movementHTML}
              <div class="prediction-row">
                <div class="pred-label">Predicted Score</div>
                <div class="pred-score">${g.awayTeam?.split(' ').pop()} ${g.predictedScore?.away ?? '?'} — ${g.predictedScore?.home ?? '?'} ${g.homeTeam?.split(' ').pop()}</div>
              </div>
              ${factors ? `<div class="factors"><div class="factors-label">Key Factors</div>${factors}</div>` : ''}
              ${injuriesHTML}
            </div>
          </div>`;
      }).join('');

      targetEl.innerHTML =
        (opts.header !== undefined
          ? opts.header
          : (currentSport === 'nfl' ? weekPickerHTML(nflWeek, nflWeeks) : '')) +
        `<div class="games-grid">${html}</div>`;
    }

    // ========================================================================
    // HISTORY TAB
    // ========================================================================

    // ---------------------------------------------------------------------
    // PICK 6
    // ---------------------------------------------------------------------
    // A weekly pool freezes its lines; the market does not. By kickoff the two
    // can be several points apart, and the gap is the edge — backing the side
    // the market moved toward, at the frozen number, went 84-56 across 2024 and
    // 2025 when the move was two points or more.
    //
    // 2025 is where the rule was found; 2024 is a holdout it was never fitted
    // to and it replicated there at every threshold. The control, backing home
    // at the opening number regardless of direction, is 50.3%.
    //
    // No model opinion is involved. The market is treated as the truth and the
    // pool line is scored against it, which is the opposite of what the rest of
    // this app does and the reason it actually works.
    let poolGames = [];
    const POOL_KEY = 'poolLines:nfl';

    // The week's card as the SERVER has it, which is the copy both players see.
    // localStorage stays as a fallback for when the database is unreachable and
    // as the thing that makes typing feel instant, but it is no longer the
    // source of truth — it could not be, because it only ever existed on one
    // device and two people play this pool off one sheet.
    let sharedLines = null;
    let sharedAt = null;
    let sharedOk = false;

    const savedPoolLines = () => {
      try { return JSON.parse(localStorage.getItem(POOL_KEY) || '{}'); } catch (e) { return {}; }
    };
    function persistPoolLines() {
      const out = {};
      for (const g of poolGames) {
        const sp = document.getElementById('ps-' + g.id);
        const ap = document.getElementById('pa-' + g.id);
        const tt = document.getElementById('pt-' + g.id);
        const spread = sp && sp.value !== '' ? Number(sp.value) : null;
        const awaySpread = ap && ap.value !== '' ? Number(ap.value) : null;
        const total = tt && tt.value !== '' ? Number(tt.value) : null;
        if (spread !== null || awaySpread !== null || total !== null) {
          // Whether the away box was typed in BY HAND is saved alongside its
          // value, because the two are not the same thing and conflating them
          // broke the mirror permanently.
          //
          // The auto-fill writes a value immediately, so "has a value" is true
          // from the first keystroke in the HOME box. Re-deriving touched from
          // that meant every row came back marked hand-edited after the first
          // tab switch, and the mirror never fired again — so correcting a home
          // line later left the away number frozen at its old value, which
          // poolEdge then reads as a both-lay line the pool never posted and
          // recommends the wrong side of.
          out[g.id] = { spread, awaySpread, total,
                        mirrorTouched: !!(sp && sp.dataset.touched === '1') };
        }
      }
      try { localStorage.setItem(POOL_KEY, JSON.stringify(out)); } catch (e) { /* ignore */ }
      sharePoolLines(out);
      return out;
    }

    // Most pool lines are two-sided, so one number mirrors the other and typing
    // it twice would be busywork. It auto-fills until it is edited by hand, and
    // then it is left alone — which is the case that matters, because a tight
    // game gets -2 against -2 with no plus money on either side.
    //
    // The AWAY box drives it now. The pool posts its card the way the matchup
    // reads, away team first, so that is the number being copied off the sheet
    // and it should be the first box under the cursor.
    // The pool's tight-game format is BOTH sides laying two, and it never posts
    // -1/+1, so a -2 is not a two-point favourite — it is that format. Mirroring
    // it to +2 was wrong every single time and had to be corrected by hand on
    // every tight game.
    const BOTH_LAY = -2;
    function mirrorHome(id) {
      const away = document.getElementById('pa-' + id);
      const home = document.getElementById('ps-' + id);
      if (!home || !away) return;
      if (home.dataset.touched !== '1') {
        if (away.value === '') home.value = '';
        else {
          const n = Number(away.value);
          home.value = String(n === BOTH_LAY ? BOTH_LAY : -n);
        }
      }
      persistPoolLines();
    }
    function markHomeTouched(id) {
      const home = document.getElementById('ps-' + id);
      if (home) home.dataset.touched = '1';
      persistPoolLines();
    }

    // The reasoning behind a verdict, folded away until asked for.
    //
    // Collapsed by default on purpose. The one-line verdict is what gets read
    // on a Sunday morning and burying it under six rows of working would make
    // the card worse, not better. But "this number is a point better than the
    // market" is an assertion until the working is available, and it was not
    // available anywhere — so it sits one click away rather than nowhere.
    function basisHTML(r) {
      if (!r || !r.basis || !r.basis.length) return '';
      const rows = r.basis.map(b => {
        const cls = b.label === 'the bottom line' ? ' why-end'
                  : (b.label === 'but note' || b.label === 'points the other way') ? ' why-note' : '';
        return `<div class="why-row${cls}"><span class="why-label">${b.label}</span>` +
               `<span class="why-text">${b.text}</span></div>`;
      }).join('');
      return `<details class="why"><summary>why this is the best bet</summary>${rows}</details>`;
    }

    function setNflWeek(w) {
      nflWeek = Number(w) || null;
      if (currentSport === 'nfl') fetchPredictions();
      else loadPool();
    }

    // The picker. Rendered wherever a football week is on screen, so the tab
    // and the pool cannot end up showing different weeks without saying so.
    function weekPickerHTML(active, total) {
      const opts = [];
      for (let w = 1; w <= (total || 18); w++) {
        opts.push(`<option value="${w}"${w === active ? ' selected' : ''}>Week ${w}</option>`);
      }
      return `<div class="weekbar">
        <label class="weekbar-label" for="weekpick">NFL schedule</label>
        <select id="weekpick" onchange="setNflWeek(this.value)">${opts.join('')}</select>
        <span class="weekbar-note">the full season is here &mdash; numbers appear as the books post them</span>
      </div>`;
    }

    async function loadSharedLines() {
      try {
        const r = await fetch(`/api/pool/nfl/lines?week=${nflWeek || ''}`);
        const d = await r.json();
        sharedOk = !!d.shared;
        sharedLines = d.lines || {};
        sharedAt = d.updatedAt || null;
      } catch (e) {
        // No shared copy available; the local one still works on this device.
        sharedOk = false; sharedLines = null; sharedAt = null;
      }
    }

    // Written back on a timer rather than on every keystroke, so typing a
    // two-digit number is one round trip instead of two.
    // A pending edit that has not reached the server yet.
    //
    // This cost Danny a real number. The save is debounced, loadPool() refetches
    // the shared copy whenever the tab or the week changes, and renderPool
    // merges with the SERVER winning — so typing 10.5 and switching tabs inside
    // the debounce window meant the fetch returned the old 9, the re-render put
    // 9 back in the box, and the next save wrote 9 over the 10.5. Backgrounding
    // a phone did the same thing more quietly: the timer simply never fired.
    let shareTimer = null;
    let pendingLines = null;

    /** Send whatever is pending right now, without waiting for the timer. */
    function flushPoolLines() {
      if (!pendingLines) return;
      const body = JSON.stringify({ week: nflWeek, lines: pendingLines });
      clearTimeout(shareTimer);
      const toSave = pendingLines;
      pendingLines = null;
      // keepalive so it survives the page being hidden or closed mid-request.
      fetch('/api/pool/nfl/lines', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body, keepalive: true,
      }).then(() => { sharedLines = toSave; sharedAt = new Date().toISOString(); })
        .catch(() => { /* the local copy still holds it */ });
    }

    // Leaving the page, hiding it, or switching apps on a phone all count.
    window.addEventListener('pagehide', flushPoolLines);
    window.addEventListener('beforeunload', flushPoolLines);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) flushPoolLines();
    });

    function sharePoolLines(lines) {
      pendingLines = lines;
      clearTimeout(shareTimer);
      shareTimer = setTimeout(async () => {
        try {
          const r = await fetch('/api/pool/nfl/lines', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ week: nflWeek, lines }),
          });
          const d = await r.json();
          sharedOk = !!d.shared;
          sharedLines = lines;
          sharedAt = new Date().toISOString();
          if (pendingLines === lines) pendingLines = null;
          const el = document.getElementById('share-state');
          if (el) el.innerHTML = shareStateHTML();
        } catch (e) { /* the local copy still holds */ }
      }, 700);
    }

    function shareStateHTML() {
      if (!sharedOk) {
        return '<span class="share-off">Saved on this device only &mdash; the shared copy is unavailable, ' +
               'so nobody else can see these yet.</span>';
      }
      const when = sharedAt ? new Date(sharedAt) : null;
      const ago = when ? (() => {
        const mins = Math.round((Date.now() - when.getTime()) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + ' min ago';
        const hrs = Math.round(mins / 60);
        if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
        return Math.round(hrs / 24) + ' days ago';
      })() : null;
      return '<span class="share-on">Shared &mdash; whoever enters these, everyone playing sees them.' +
             (ago ? ' Last change ' + ago + '.' : ' Nothing entered yet.') + '</span>';
    }

    async function loadPool() {
      // Anything typed but not yet sent goes first. Otherwise the fetch below
      // returns the pre-edit copy and the re-render hands it straight back.
      flushPoolLines();
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading this week&rsquo;s games and market lines...</div></div>';
      try {
        const res = await fetch('/api/pool/nfl' + (nflWeek ? `?week=${nflWeek}` : ''));
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        poolGames = data.games || [];
        if (data.week) { nflWeek = data.week; nflWeeks = data.weeks || nflWeeks; }
        // Asked for AFTER the games, because it is keyed by the week the server
        // resolved rather than whatever this tab thought the week was.
        await loadSharedLines();
        renderPool();
      } catch (err) {
        content.innerHTML = `<div class="error">❌ ${err.message}</div>`;
      }
    }

    /**
     * What makes this a Pick 6 pick rather than a bet — the frozen number
     * against the live one.
     *
     * Everything else on the card is the same read the NFL tab gives. This is
     * the part that is only true because a pool posted its lines on Wednesday
     * and the market kept moving.
     *
     * "not backed" is gone. The badge said nothing a reader could act on, and
     * the gap and the market move say the same thing concretely: a half point
     * off a line that moved six is visibly different from two points off one
     * that moved two, without needing a label to interpret it.
     */
    function poolBlockHTML(b) {
      if (!b) return '';
      const notes = [];
      if (b.overlapProb > 0.005) notes.push(`${(b.overlapProb * 100).toFixed(1)}% both sides win`);
      if (b.deadProb > 0.005) notes.push(`${(b.deadProb * 100).toFixed(1)}% neither side wins`);
      if (b.pushProb > 0.005) notes.push(`${(b.pushProb * 100).toFixed(1)}% lands on the number — a loss here`);
      const mv = b.market === 'total' ? b.totalMovement : b.spreadMovement;
      return `<div class="pool-block">
        <div class="pool-block-head">Your pool pick
          <strong>${b.pick}</strong>
          <span class="pool-block-prob">${(b.winProb * 100).toFixed(1)}%</span></div>
        <div class="pool-block-line">your line ${b.poolLine} &middot; market ${b.marketLine}
          &middot; <strong>${b.gap} pt${b.gap === 1 ? '' : 's'} of daylight</strong>${
          Number.isFinite(mv) && Math.abs(mv) >= 0.5
            ? ` &middot; the market itself moved ${Math.abs(mv)}` : ''}</div>
        ${notes.length ? `<div class="pool-block-note">${notes.join(' &middot; ')}</div>` : ''}
      </div>`;
    }

    // The card, not the picks.
    //
    // Every number on this tab was per-pick, which is the wrong altitude for a
    // pool that pays only on a perfect week. Six picks at 58% is a 3.8% week and
    // six at 60% is 4.7% — the better card is worth nearly a quarter more, and
    // nothing on screen said so, because a card is a product and the interface
    // only ever showed the factors.
    function cardOddsHTML(card) {
      if (!card || !card.picks) return '';
      const pct = (x) => (x * 100).toFixed(2) + '%';
      const bits = [];
      if (!card.complete) {
        bits.push(`<span class="card-warn">only ${card.picks} pick${card.picks === 1 ? '' : 's'} &mdash; a short card cannot win a perfect-week pool</span>`);
      }
      if (card.pushCost > 0.02) {
        const who = card.pushiest ? card.pushiest.pick : 'a whole number';
        bits.push(`<span class="card-warn">pushes are costing this card ${(card.pushCost * 100).toFixed(0)}% ` +
          `&mdash; ${who} lands exactly on its number ${(card.pushiest.pushProb * 100).toFixed(1)}% of the time, ` +
          `and a push loses here</span>`);
      }
      if (card.unsupported) {
        bits.push(`<span class="card-warn">${card.unsupported} of these rest on a market move under 2 points.
          Moves that small did not improve the number (50.5% over 190 games), so treat this figure as optimistic.</span>`);
      }
      if (card.weakest && card.weakest.pick) {
        bits.push(`weakest link: ${card.weakest.pick} at ${(card.weakest.winProb * 100).toFixed(1)}%`);
      }
      return `<div class="card-odds">
        <div class="card-headline">This card goes ${card.picks}-0 about
          <strong>1 week in ${card.oneIn}</strong>
          <span class="card-sub">(${pct(card.perfect)})</span></div>
        ${bits.map(b => `<div class="card-line">${b}</div>`).join('')}
      </div>`;
    }

    function renderPool() {
      // Shared first. A row the server has beats the local copy, because the
      // local copy is whatever THIS browser last typed and the server's is what
      // the pool actually posted.
      const local = savedPoolLines();
      // Server wins, EXCEPT while an edit is still on its way there. Without
      // that exception a fetch landing mid-edit hands back the pre-edit number
      // and the box silently reverts under the cursor.
      const saved = (sharedOk && !pendingLines)
        ? { ...local, ...(sharedLines || {}) }
        : { ...(sharedLines || {}), ...local };
      if (!poolGames.length) {
        document.getElementById('content').innerHTML =
          '<div class="no-games">No upcoming NFL games in the next week.</div>';
        return;
      }
      const rows = poolGames.map(g => {
        const v = saved[g.id] || {};
        // Both teams laying points is the pool's own format for a tight game,
        // and it is worth marking because those are the worst picks available.
        const bothLay = Number.isFinite(v.spread) && Number.isFinite(v.awaySpread) &&
                        Math.abs(v.spread + v.awaySpread) > 1e-9;
        // A bare number here said nothing about WHOSE it was. The same game can
        // read Baltimore -3 one day and Baltimore +1 the next, and the column
        // showed only the digits, so there was no way to tell which side the
        // market had moved to. Always name the side LAYING the points.
        const shortName = (full) => String(full || '').split(' ').pop();   // also used by the movement line below
        const ms = g.marketSpread === null ? '—'
          : g.marketSpread === 0 ? 'pick &rsquo;em'
          : g.marketSpread < 0
            ? `${shortName(g.homeTeam)} ${g.marketSpread}`
            : `${shortName(g.awayTeam)} ${-g.marketSpread}`;
        const mt = g.marketTotal === null ? '—' : g.marketTotal;
        return `
          <tr>
            <td>${g.awayTeam} @ <strong>${g.homeTeam}</strong>${(() => {
              // Only when it is worth a line. The first version printed both
              // teams' counts and the league median on all sixteen games, which
              // is three numbers per row to say "normal" fifteen times. A side
              // three or more above the median is the case that moves a price;
              // everything else is the ordinary attrition of a season and does
              // not need saying.
              const inj = g.injuriesOut;
              if (!inj || !Number.isFinite(inj.baseline)) return '';
              const notable = [[shortName(g.awayTeam), inj.away], [shortName(g.homeTeam), inj.home]]
                .filter(([, n]) => Number.isFinite(n) && n >= inj.baseline + 3);
              if (!notable.length) return '';
              return `<div class="pool-inj">${notable
                .map(([t, n]) => `${t} missing ${n}`).join(' &middot; ')}</div>`;
            })()}<div class="pool-market">${g.gameTime}${
              g.earlyWeek ? ` &middot; <span class="pool-early">${g.kickoffDay || 'early'} &mdash; played before you pick</span>` : ''
            }</div></td>
            <td class="pool-market">${ms}${(() => {
              // What the market DID, under where it is. The tab showed only the
              // current number, so a game the market had moved six points read
              // exactly like one that never moved at all — and whether the
              // number you are holding is behind a BETTER one is entirely a
              // question about movement.
              if (!Number.isFinite(g.openSpread) || !Number.isFinite(g.spreadMovement)) return '';
              // Under a point is not a move worth a line of its own, and
              // "has not moved" on half the board was noise pretending to be
              // information. Where it DID move, one line: where it started.
              // The size is the difference between the two numbers, which the
              // reader can see, so printing it as well said everything twice.
              const size = Math.abs(g.spreadMovement);
              if (size < 1) return '';
              const openShown = g.openSpread === 0 ? 'pick &rsquo;em'
                : g.openSpread < 0 ? `${shortName(g.homeTeam)} ${g.openSpread}`
                : `${shortName(g.awayTeam)} ${-g.openSpread}`;
              return `<div class="pool-moved ${size >= 2 ? 'big' : ''}">from ${openShown}</div>`;
            })()}${(() => {
              // The week day by day — but only when the days actually differ.
              // A track reading "Thu -3 Fri -3 Sat -3" is four words to say the
              // number held, which the line above already implies. It earns its
              // space when it shows the number moving AFTER the pool froze its
              // card, which is the whole reason for recording it.
              const days = (g.lineDays || []).filter(d => Number.isFinite(d.spread));
              if (days.length < 2) return '';
              const spreads = days.map(d => d.spread);
              if (Math.max(...spreads) === Math.min(...spreads)) return '';
              const label = (d) => {
                const [y, m, dd] = d.day.split('-').map(Number);
                return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(y, m - 1, dd).getDay()];
              };
              const sgn = (n) => n > 0 ? '+' + n : String(n);
              return `<div class="pool-track">${days.map(d =>
                `${label(d)} ${sgn(d.spread)}`).join(' ')}</div>`;
            })()}</td>
            <td><input id="pa-${g.id}" type="number" step="0.5" placeholder="—"
                       value="${v.awaySpread ?? ''}" oninput="mirrorHome('${g.id}')"></td>
            <td><input id="ps-${g.id}" type="number" step="0.5" placeholder="—"
                       class="${bothLay ? 'pool-bothlay' : ''}"
                       data-touched="${v.mirrorTouched ? '1' : '0'}"
                       value="${v.spread ?? (v.awaySpread !== null && v.awaySpread !== undefined ? -v.awaySpread : '')}"
                       oninput="markHomeTouched('${g.id}')"></td>
            <td class="pool-market">${mt}</td>
            <td><input id="pt-${g.id}" type="number" step="0.5" placeholder="—"
                       value="${v.total ?? ''}" oninput="persistPoolLines()"></td>
          </tr>`;
      }).join('');

      document.getElementById('content').innerHTML = `
        ${weekPickerHTML(nflWeek, nflWeeks)}
        <div class="pool-note">
          Enter your pool&rsquo;s lines beside the current number at your book. Each team&rsquo;s
          number goes in its own box, in the order the matchup reads &mdash; away team first,
          the way the pool posts it. So a normal line is <strong>+3</strong> away and
          <strong>-3</strong> home, and the home box fills itself in until you change it.
          <div id="share-state" class="share-state">${shareStateHTML()}</div>
          <br><br>
          Where the pool lays points BOTH ways &mdash; <strong>-2</strong> against
          <strong>-2</strong> on a tight game, no plus money anywhere &mdash; type both numbers.
          That is not a spread and it is not priced like one: whichever side you take has to win
          by three, and if the game lands inside two points either way, both picks lose. On an
          even matchup that is roughly a 43% shot with 14% belonging to nobody, where a two-sided
          line would be near 50%. Those are the worst numbers on the board and ranking now says so.
          <br><br>
          Ranking is by win probability rather than the size of the gap, because two points across
          a key number is worth more than three through empty space.
          <br><br>
          <strong>Spreads are the tested half.</strong> The same rule was run on totals over the
          same 543 games and does not hold: a total that moved a point went 51.4% across 401 bets
          against 55.4% for spreads, it does not repeat between seasons, and fading it is no
          better. Taking the over at the opening number regardless of movement went 51.9%, so the
          movement is adding almost nothing. Totals are still priced here, and a stale total is
          still worth what the arithmetic says &mdash; there is just no evidence behind it the way
          there is for spreads. Given a choice between a stale spread and a stale total, take the
          spread.
        </div>
        <div style="margin-bottom:14px">
          <button class="btn btn-primary" onclick="rankPool()">Rank my picks</button>
        </div>
        <div id="pool-results"></div>
        <table class="pool-table">
          <thead><tr>
            <th>Game</th><th>${(() => {
              // Name the source. "Market" was ambiguous and the answer has
              // changed: it is the book being bet at, not a consensus.
              const froms = [...new Set(poolGames.map(g => g.marketFrom).filter(Boolean))];
              return froms.length === 1 ? froms[0] : 'Market';
            })()} spread</th><th>Away line</th><th>Home line</th>
            <th>Market total</th><th>Your total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    async function rankPool() {
      const lines = persistPoolLines();
      const target = document.getElementById('pool-results');
      if (!Object.keys(lines).length) {
        target.innerHTML = '<div class="pool-note">Enter at least one of your pool&rsquo;s lines first.</div>';
        return;
      }
      target.innerHTML = '<div class="loading"><div class="spinner"></div><div>Scoring against the market...</div></div>';
      try {
        const res = await fetch('/api/pool/nfl', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lines, count: 6, ...(nflWeek ? { week: nflWeek } : {}) }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (!data.best || !data.best.length) {
          target.innerHTML = '<div class="pool-note">Nothing to rank yet — the market has no line for those games.</div>';
          return;
        }
        // Fired AFTER the picks are drawn. It is the same endpoint the NFL tab
        // uses, so usually a cache hit, but on a cold week it takes the better
        // part of a minute and the ranking should not wait behind it.
        // The Pick 6 renders the NFL tab's own cards.
        //
        // It used to be a list of one-line picks, which read nothing like the
        // rest of the app and could not show a weather badge, an injury box or
        // a game blurb without growing a second copy of all of it. Same cards,
        // same code, with the pool arithmetic injected at the top of each body
        // — so the thing that makes a Pick 6 a Pick 6 sits above everything the
        // live tab already knew about the game.
        const picks = data.best || [];
        const byGame = {};
        for (const b of picks) byGame[b.gameId] = b;

        // "Best 6 of 10" counted CANDIDATES, which is a number nobody asked
        // about — a game with a spread and a total counted twice, so the
        // denominator did not match anything on screen. Say what was actually
        // compared: the games with a line entered.
        const entered = new Set(picks.map(b => b.gameId));
        const withLines = poolGames.filter(g => {
          const v = (sharedOk ? (sharedLines || {}) : savedPoolLines())[g.id];
          return v && (Number.isFinite(v.spread) || Number.isFinite(v.total));
        }).length;

        target.innerHTML = `<h3 style="margin:0 0 10px">Your best ${picks.length}
            <span style="font-weight:400;color:#8b949e;font-size:13px">
              &mdash; from the ${withLines} game${withLines === 1 ? '' : 's'} you have lines for</span></h3>
          ${cardOddsHTML(data.card)}
          <div id="p6-cards"><div class="loading"><div class="spinner"></div>
            <div>Loading the full read on these six...</div></div></div>`;

        try {
          const r = await fetch('/api/predictions', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sport: 'nfl', ...(nflWeek ? { week: nflWeek } : {}) }),
          });
          const pred = await r.json();
          // Every game, not just the six.
          //
          // Danny has said twice that he wants to see the whole board, and the
          // six-card version hid the ten he did not pick — including the ones
          // he might have wanted to argue with. The picks come first, in rank
          // order, then the rest of the week behind them.
          const pickIds = picks.map(b => b.gameId);
          const restIds = (pred.games || [])
            .map(g => g.id)
            .filter(id => id && !entered.has(id));
          renderGames(pred, {
            target: 'p6-cards',
            header: '',
            onlyIds: [...pickIds, ...restIds],
            extraFor: (g) => byGame[g.id]
              ? poolBlockHTML(byGame[g.id])
              : '<div class="pool-block pool-block-off">Not in your best ' + picks.length +
                ' this week &mdash; shown because a card you can see is a card you can argue with.</div>',
            hidePoolFlag: true,
            poolFor: (g) => (sharedOk ? (sharedLines || {}) : savedPoolLines())[g.id] || null,
          });
        } catch (e) {
          // The ranking is the part that matters and it is already computed;
          // losing the cards should not lose the picks.
          document.getElementById('p6-cards').innerHTML =
            picks.map(b => `<div class="pool-pick">${poolBlockHTML(b)}</div>`).join('');
        }
      } catch (err) {
        target.innerHTML = `<div class="error">❌ ${err.message}</div>`;
      }
    }

    async function loadHistory() {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>Loading pick history...</div>
        </div>`;

      try {
        const url = historyFilter ? `/api/history?sport=${historyFilter}` : '/api/history';
        const res = await fetch(url);
        if (!res.ok) throw new Error('Server error: ' + res.status);
        const data = await res.json();

        if (!data.available) {
          content.innerHTML = `
            <div class="no-games">
              📊 Pick tracking is not available yet.<br><br>
              <span style="font-size: 13px;">${data.message || 'The database is not configured or no picks have been recorded yet. Make some predictions and check back!'}</span>
            </div>`;
          return;
        }

        renderHistory(data);
      } catch (err) {
        content.innerHTML = `<div class="error">❌ Error loading history: ${err.message}</div>`;
      }
    }

    function setHistoryFilter(filter, el) {
      historyFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      loadHistory();
    }

    function pctClass(wins, losses) {
      const total = wins + losses;
      if (total === 0) return 'neutral';
      const pct = wins / total;
      if (pct >= 0.55) return 'good';
      if (pct < 0.50) return 'bad';
      return 'neutral';
    }

    function fmtRecord(wins, losses, pushes) {
      wins = parseInt(wins) || 0;
      losses = parseInt(losses) || 0;
      pushes = parseInt(pushes) || 0;
      const total = wins + losses;
      const pct = total > 0 ? ((wins / total) * 100).toFixed(1) : '0.0';
      const recordStr = pushes > 0 ? `${wins}-${losses}-${pushes}` : `${wins}-${losses}`;
      return { record: recordStr, pct, cls: pctClass(wins, losses) };
    }

    function renderHistory(data) {
      const overall = data.overall || {};
      const wins = parseInt(overall.wins) || 0;
      const losses = parseInt(overall.losses) || 0;
      const pushes = parseInt(overall.pushes) || 0;
      const pending = parseInt(overall.pending) || 0;
      const total = wins + losses;
      const winPct = total > 0 ? ((wins / total) * 100).toFixed(1) : '0.0';

      // Rough profit calculation: assumes -110 juice on all bets, $100 unit
      // Win = +$90.91, Loss = -$100, Push = $0
      const unitProfit = (wins * 90.91) - (losses * 100);
      const profitColor = unitProfit > 0 ? '#3fb950' : unitProfit < 0 ? '#f85149' : '#8b949e';

      // Filter buttons
      const filtersHTML = `
        <div class="history-filters">
          <button class="filter-btn ${historyFilter === null ? 'active' : ''}" onclick="setHistoryFilter(null, this)">All Sports</button>
          <button class="filter-btn ${historyFilter === 'nba' ? 'active' : ''}" onclick="setHistoryFilter('nba', this)">🏀 NBA</button>
          <button class="filter-btn ${historyFilter === 'nhl' ? 'active' : ''}" onclick="setHistoryFilter('nhl', this)">🏒 NHL</button>
          <button class="filter-btn ${historyFilter === 'mlb' ? 'active' : ''}" onclick="setHistoryFilter('mlb', this)">⚾ MLB</button>
        </div>`;

      // Summary cards
      const summaryHTML = `
        <div class="history-summary">
          <div class="summary-card">
            <div class="summary-label">Overall Record</div>
            <div class="summary-value">${wins}-${losses}${pushes > 0 ? '-' + pushes : ''}</div>
            <div class="summary-sub">${total} graded picks</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Win Rate</div>
            <div class="summary-value ${parseFloat(winPct) >= 52.4 ? 'win-rate' : 'loss-rate'}">${winPct}%</div>
            <div class="summary-sub">52.4% needed at -110</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Pending</div>
            <div class="summary-value pending">${pending}</div>
            <div class="summary-sub">awaiting results</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Profit (per $100 unit)</div>
            <div class="summary-value" style="color: ${profitColor};">${unitProfit >= 0 ? '+' : ''}$${unitProfit.toFixed(0)}</div>
            <div class="summary-sub">assumes -110 juice</div>
          </div>
        </div>`;

      // By Market breakdown
      let marketHTML = '';
      if (data.byMarket && data.byMarket.length > 0) {
        const marketCards = data.byMarket.map(m => {
          const r = fmtRecord(m.wins, m.losses, m.pushes);
          return `
            <div class="breakdown-card">
              <div class="breakdown-name">${m.market === 'spread' ? 'Spread / Run Line / Puck Line' : m.market.toUpperCase()}</div>
              <div class="breakdown-record">${r.record}<span class="breakdown-pct ${r.cls}">${r.pct}%</span></div>
            </div>`;
        }).join('');
        marketHTML = `
          <div class="history-section">
            <div class="history-section-title">Performance by Market</div>
            <div class="breakdown-grid">${marketCards}</div>
          </div>`;
      }

      // By Confidence breakdown
      // CLOSING LINE VALUE.
      //
      // The win-loss record needs about 1,500 settled bets to say anything —
      // eighteen seasons at this volume. CLV is readable the moment a line
      // closes, compares a number against a number rather than against one
      // coin flip, and is the only feedback here that can say something inside
      // a single season. The columns and the capture job already existed; this
      // is the first thing that reads them.
      let clvHTML = '';
      if (data.clv && data.clv.picks > 0) {
        const c = data.clv;
        const good = c.avgPoints > 0;
        clvHTML = `
          <div class="clv-box">
            <div class="clv-head">Closing line value &middot; ${c.picks} graded spread pick${c.picks === 1 ? '' : 's'}</div>
            <div class="clv-row">
              <div class="clv-fig ${good ? 'clv-good' : 'clv-bad'}">${c.avgPoints > 0 ? '+' : ''}${c.avgPoints}</div>
              <div class="clv-lab">points per bet against the close</div>
            </div>
            <div class="clv-detail">
              beat the close ${c.beatClose} &middot; worse ${c.worseThanClose} &middot; level ${c.level}
              (${c.beatPct}% beat it)
            </div>
            <div class="clv-note">
              Positive means the line moved toward the side recommended &mdash; the bet was taken
              at a better number than the market settled on. This is the fastest honest read on
              whether the app is finding anything; a win-loss record needs roughly 1,500 bets to
              say the same thing.${c.picks < 30 ? ' Too few picks yet to mean much.' : ''}
            </div>
          </div>`;
      }

      // THE PICK 6 RECORD.
      //
      // Separate from the live recommendations on purpose: a pool entry settles
      // against a line frozen on Wednesday and a recommendation against the
      // number on offer now, so one average would describe neither. A push is a
      // loss here, which is this pool's rule.
      let poolHTML = '';
      if (data.poolRecord && data.poolRecord.picks > 0) {
        const p = data.poolRecord;
        const beat = p.winRate !== null && p.winRate > 52.4;
        poolHTML = `
          <div class="clv-box">
            <div class="clv-head">Pick 6 record &middot; ${p.picks} logged, ${p.pending} still to play</div>
            ${p.settled ? `
              <div class="clv-row">
                <div class="clv-fig ${beat ? 'clv-good' : 'clv-bad'}">${p.winRate}%</div>
                <div class="clv-lab">${p.wins}-${p.losses}${p.pushes ? ` (${p.pushes} landed on the number, counted as losses)` : ''}</div>
              </div>
              <div class="clv-detail">
                ${p.spread ? `spreads ${p.spread.wins}/${p.spread.n} (${p.spread.winRate}%)` : ''}
                ${p.totals ? ` &middot; totals ${p.totals.wins}/${p.totals.n} (${p.totals.winRate}%)` : ''}
              </div>` : '<div class="clv-detail">Nothing settled yet.</div>'}
            <div class="clv-note">
              Logged automatically whenever you rank, so this builds without anybody writing
              anything down. The backtest that this rule rests on says a two-point stale spread
              wins about 60% &mdash; this is the same rule measured on your pool rather than on
              somebody else's lines.${p.settled && p.settled < 30 ? ' Far too few to mean anything yet.' : ''}
            </div>
          </div>`;
      }

      let byConfidenceHTML = '';
      if (data.byConfidence && data.byConfidence.length > 0) {
        const order = { 'High': 0, 'Medium': 1, 'Low': 2 };
        const sorted = [...data.byConfidence].sort((a, b) => (order[a.confidence] ?? 99) - (order[b.confidence] ?? 99));
        const confCards = sorted.map(c => {
          const r = fmtRecord(c.wins, c.losses, c.pushes);
          return `
            <div class="breakdown-card">
              <div class="breakdown-name">${c.confidence || 'Unknown'} Confidence</div>
              <div class="breakdown-record">${r.record}<span class="breakdown-pct ${r.cls}">${r.pct}%</span></div>
            </div>`;
        }).join('');
        byConfidenceHTML = `
          <div class="history-section">
            <div class="history-section-title">Performance by Confidence Level</div>
            <div class="breakdown-grid">${confCards}</div>
          </div>`;
      }

      // Recent picks table
      let recentHTML = '';
      if (data.recent && data.recent.length > 0) {
        const rows = data.recent.map(p => {
          let resultPill;
          if (p.result === 'win') resultPill = '<span class="result-pill win">Win</span>';
          else if (p.result === 'loss') resultPill = '<span class="result-pill loss">Loss</span>';
          else if (p.result === 'push') resultPill = '<span class="result-pill push">Push</span>';
          else resultPill = '<span class="result-pill pending">Pending</span>';

          const dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString() : '';
          const matchup = `${(p.away_team || '').split(' ').pop()} @ ${(p.home_team || '').split(' ').pop()}`;
          const finalScore = (p.actual_home !== null && p.actual_away !== null)
            ? `${p.actual_away}-${p.actual_home}`
            : '—';
          const edgeStr = p.edge !== null ? (parseFloat(p.edge) > 0 ? '+' : '') + parseFloat(p.edge).toFixed(1) + '%' : '—';

          return `
            <tr>
              <td>${dateStr}</td>
              <td>${(p.sport || '').toUpperCase()}</td>
              <td>${matchup}</td>
              <td>${p.market || ''}</td>
              <td><strong>${p.pick || ''}</strong></td>
              <td>${edgeStr}</td>
              <td>${p.confidence || ''}</td>
              <td>${finalScore}</td>
              <td>${resultPill}</td>
            </tr>`;
        }).join('');

        recentHTML = `
          <div class="history-section">
            <div class="history-section-title">Recent Picks (Last 50)</div>
            <table class="picks-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Sport</th>
                  <th>Matchup</th>
                  <th>Market</th>
                  <th>Pick</th>
                  <th>Edge</th>
                  <th>Conf</th>
                  <th>Final</th>
                  <th>Result</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      } else {
        recentHTML = `
          <div class="no-games">
            No picks recorded yet. Once you fetch predictions for NBA, NHL, or MLB games with edges, they'll appear here and get graded automatically when games finish.
          </div>`;
      }

      document.getElementById('content').innerHTML = filtersHTML + summaryHTML + poolHTML + clvHTML + marketHTML + byConfidenceHTML + recentHTML;
    }
  </script>
</body>
</html>
