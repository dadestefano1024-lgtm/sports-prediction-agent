  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }
    .brand-shark {
      width: 30px; height: 30px; vertical-align: -7px; margin-right: 9px;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 20px; font-weight: 700; color: #58a6ff; }
    header span { font-size: 12px; color: #8b949e; }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 20px 24px 0;
      border-bottom: 1px solid #30363d;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 20px;
      border-radius: 6px 6px 0 0;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: transparent;
      color: #8b949e;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; background: #161b22; }
    .tab:hover:not(.active) { color: #e6edf3; }
    .controls {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary { background: #238636; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    .refresh-info { font-size: 12px; color: #8b949e; }

    .arb-alert {
      background: linear-gradient(90deg, #1a0a2e 0%, #2d1b4e 100%);
      border: 1px solid #8b5cf6;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 0 24px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .arb-alert-icon { font-size: 24px; }
    .arb-alert-text { flex: 1; }
    .arb-alert-title { font-weight: 700; color: #a78bfa; font-size: 14px; }
    .arb-alert-desc { font-size: 12px; color: #c4b5fd; margin-top: 2px; }
    .arb-profit { font-size: 18px; font-weight: 800; color: #10b981; }

    .content { padding: 0 24px 24px; }
    .loading { text-align: center; padding: 60px; color: #8b949e; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      background: #1a0a0a;
      border: 1px solid #6e1010;
      border-radius: 8px;
      padding: 16px;
      color: #f85149;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
    }
    .game-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .game-card:hover { border-color: #58a6ff44; }
    .game-card.value-bet { border-color: #2ea04388; }
    .card-header {
      background: #1c2128;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .teams { font-size: 15px; font-weight: 700; }
    .game-time { font-size: 12px; color: #8b949e; margin-top: 4px; }
    .header-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .rank-badge {
      display: inline-block;
      background: #388bfd22;
      color: #58a6ff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 4px;
    }
    .card-body { padding: 14px 16px; }

    .pool-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pool-table th {
      text-align: left; padding: 8px 6px; border-bottom: 1px solid #30363d;
      color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase;
    }
    .pool-table td { padding: 7px 6px; border-bottom: 1px solid #21262d; }
    .pool-table input {
      width: 62px; background: #0d1117; color: #c9d1d9;
      border: 1px solid #30363d; border-radius: 4px; padding: 4px 6px; font-size: 13px;
    }
    .pool-table input:focus { outline: none; border-color: #58a6ff; }
    .pool-market { color: #8b949e; font-variant-numeric: tabular-nums; }
    .pool-pick {
      background: #161b22; border: 1px solid #30363d; border-left: 3px solid #58a6ff;
      border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
    }
    .pool-pick.strong { border-left-color: #3fb950; }
    .pool-pick .headline { font-weight: 700; font-size: 15px; }
    .pool-pick .detail { color: #8b949e; font-size: 12px; margin-top: 3px; }
    .pool-note {
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 12px 14px; margin-bottom: 14px; color: #8b949e; font-size: 12px; line-height: 1.5;
    }
    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1c3a5e;
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .lines-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .line-item { flex: 1; min-width: 70px; }
    .line-label { font-size: 10px; color: #8b949e; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
    .line-value { font-size: 15px; font-weight: 700; }
    .verdict {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      padding: 9px 11px; border-radius: 6px; margin-bottom: 10px;
      background: #161b22; border: 1px solid #30363d; border-left: 3px solid #6e7681;
    }
    /* Two things are colour-coded here, and they must never be confused.
       GREEN is a price advantage: the book is offering a better number than
       the market, which is a fact about what is on offer. BLUE is a lean: no
       price advantage, just the projection and the situation agreeing, and the
       projection has been measured at 0.35 points per game worse than the
       closing line. Green means bet. Blue means "if you are betting anyway".
       Grey means neither, which is most games.

       `edge`/`slight`/`lean`/`coinflip`/`pass` come from bestBet, and
       `strong`/`none` from the older betRecommendation the interface still
       falls back to. Both sets are covered, because a level with no rule
       silently renders as grey - which is how Best bet came to look exactly
       like No lean. */
    .verdict.edge,
    .verdict.strong   { border-left-color: #3fb950; background: #0f2a1a; }
    .verdict.slight   { border-left-color: #3fb950; }
    .verdict.lean     { border-left-color: #58a6ff; }
    .verdict.coinflip,
    .verdict.none     { border-left-color: #6e7681; }
    .verdict.pass     { border-left-color: #6e7681; opacity: 0.75; }

    .verdict-label { font-weight: 800; font-size: 14px; }
    .verdict.edge .verdict-label,
    .verdict.strong .verdict-label { color: #3fb950; }
    .verdict.slight .verdict-label { color: #56d364; }
    .verdict.lean .verdict-label   { color: #58a6ff; }
    .verdict.coinflip .verdict-label,
    .verdict.none .verdict-label,
    .verdict.pass .verdict-label   { color: #8b949e; }

    .verdict-pick { font-weight: 800; font-size: 15px; color: #c9d1d9; }
    .verdict-caveat { font-size: 11px; color: #8b949e; font-style: italic; margin-top: 4px; }
    .verdict-reason { font-size: 12px; color: #8b949e; }
    .assessment {
      font-size: 13px; color: #c9d1d9; line-height: 1.5;
      padding: 10px 12px; margin-bottom: 10px;
      background: #0d1117; border: 1px solid #21262d; border-radius: 6px;
    }
    .sit-flag {
      font-size: 12px; line-height: 1.45; margin-top: 6px;
      padding: 7px 10px; border-radius: 5px;
      background: #1c1408; border-left: 3px solid #d29922; color: #d6b656;
    }
    .sit-flag.high { background: #2a1215; border-left-color: #f85149; color: #f0a0a0; }
    .pool-flag {
      font-size: 11px; color: #58a6ff; margin-top: 5px;
      padding-top: 5px; border-top: 1px solid #21262d;
    }
    .line-sub { font-size: 10px; color: #6e7681; margin-top: 2px; }
    input.pool-bothlay { border-color: #d29922; }
    .inj-box { margin-top: 10px; border: 1px solid #21262d; border-radius: 6px;
               background: #10151c; }
    .inj-summary { cursor: pointer; padding: 7px 10px; font-size: 12px; color: #c9d1d9;
                   list-style: none; user-select: none; }
    .inj-summary::-webkit-details-marker { display: none; }
    .inj-summary::before { content: '\25B8'; display: inline-block; width: 12px;
                           color: #6e7681; transition: transform 0.12s; }
    .inj-box[open] .inj-summary::before { transform: rotate(90deg); }
    .inj-counts { font-size: 11px; margin-left: 6px; }
    .inj-body { padding: 2px 10px 9px 22px; }
    .inj-team { font-size: 11px; color: #58a6ff; font-weight: 600;
                margin: 7px 0 3px; }
    .inj-row { display: flex; gap: 7px; align-items: baseline; font-size: 11px;
               padding: 1px 0; }
    .inj-row.inj-dim { opacity: 0.55; }
    .inj-status { flex: 0 0 auto; font-weight: 700; font-size: 10px; }
    .inj-name { color: #c9d1d9; }
    .inj-pos { color: #6e7681; font-size: 10px; }
    .inj-type { color: #6e7681; font-size: 10px; margin-left: auto;
                text-align: right; max-width: 45%; }
    .inj-out { color: #f85149; }
    .inj-doubt { color: #d29922; }
    .inj-quest { color: #8b949e; }
    .inj-long { color: #6e7681; }
    .rl-row { margin-bottom: 10px; padding: 8px 10px; background: #10151c; border-radius: 6px; }
    .rl-label { font-size: 10px; color: #6e7681; text-transform: uppercase;
                letter-spacing: 0.4px; margin-bottom: 6px; }
    .rl-cells { display: flex; gap: 18px; }
    .rl-item { flex: 1; }
    .rl-team { font-size: 11px; color: #8b949e; }
    .rl-price { font-size: 15px; font-weight: 700; color: #c9d1d9; }
    .rl-price.rl-good { color: #3fb950; }
    .rl-price.rl-bad { color: #8b949e; }
    .rl-fair { font-size: 10px; color: #6e7681; margin-top: 1px; }
    .line-sub.better { color: #3fb950; }
    .line-value.favorite { color: #3fb950; }

    /* ============================================================ */
    /* LINE MOVEMENT TABLE — full-detail Open vs Current vs Move    */
    /* ============================================================ */
    .movement-section {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .movement-title {
      font-size: 10px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .movement-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .movement-table th {
      text-align: left;
      font-size: 10px;
      color: #8b949e;
      font-weight: 600;
      text-transform: uppercase;
      padding: 4px 6px 6px;
      border-bottom: 1px solid #21262d;
    }
    .movement-table td {
      padding: 6px;
      border-bottom: 1px solid #1a1f26;
    }
    .movement-table tr:last-child td { border-bottom: none; }
    .movement-table .market-name {
      font-weight: 700;
      color: #e6edf3;
    }
    .movement-table .num-cell {
      font-family: 'SF Mono', Menlo, monospace;
      font-weight: 600;
    }
    .move-up { color: #f85149; font-weight: 700; }
    .move-down { color: #3fb950; font-weight: 700; }
    .move-flat { color: #8b949e; }

    .sharp-signals {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #21262d;
    }
    .sharp-signal-item {
      font-size: 11px;
      padding: 4px 8px;
      margin-top: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sharp-signal-item.strong {
      background: #2d1500;
      border: 1px solid #d29922;
      color: #f0c674;
    }
    .sharp-signal-item.moderate {
      background: #1a1a0a;
      border: 1px solid #6b5b00;
      color: #d29922;
    }
    .sharp-icon { font-size: 13px; }

    .prediction-row {
      background: #0d1117;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .pred-label { font-size: 11px; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .pred-score { font-size: 18px; font-weight: 800; color: #58a6ff; }


    .rec-label { font-size: 10px; color: #8b949e; text-transform: uppercase; margin-bottom: 2px; }
    .rec-value { font-size: 16px; font-weight: 800; color: #3fb950; }
    .rec-edge { font-size: 14px; font-weight: 700; color: #3fb950; background: #2ea04333; padding: 4px 10px; border-radius: 4px; }

    .confidence {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .confidence.High { background: #0f2a1a; color: #3fb950; }
    .confidence.Medium { background: #1a1a0a; color: #d29922; }
    .confidence.Low { background: #1a0f0f; color: #f85149; }
    .factors { margin-top: 8px; }
    .factors-label { font-size: 11px; color: #8b949e; margin-bottom: 5px; }
    .factor-item {
      font-size: 12px;
      color: #8b949e;
      padding: 3px 0;
      border-top: 1px solid #21262d;
    }
    .factor-item:before { content: '→ '; color: #58a6ff; }
    .no-games {
      text-align: center;
      padding: 48px;
      color: #8b949e;
      font-size: 15px;
    }

    /* ============================================================ */
    /* HISTORY TAB                                                   */
    /* ============================================================ */
    .history-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .summary-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .summary-label {
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .summary-value {
      font-size: 24px;
      font-weight: 800;
      color: #e6edf3;
    }
    .summary-value.win-rate { color: #3fb950; }
    .summary-value.loss-rate { color: #f85149; }
    .summary-value.pending { color: #d29922; }
    .summary-sub {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }
    .history-section {
      margin-bottom: 24px;
    }
    .history-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #58a6ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .breakdown-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 14px;
    }
    .breakdown-name {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .breakdown-record {
      font-size: 18px;
      font-weight: 800;
      color: #e6edf3;
    }
    .breakdown-pct {
      font-size: 12px;
      margin-left: 6px;
    }
    .breakdown-pct.good { color: #3fb950; }
    .breakdown-pct.bad { color: #f85149; }
    .breakdown-pct.neutral { color: #8b949e; }

    .picks-table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      font-size: 12px;
    }
    .picks-table th {
      background: #1c2128;
      text-align: left;
      padding: 10px 12px;
      font-size: 10px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #30363d;
    }
    .picks-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #21262d;
      color: #e6edf3;
    }
    .picks-table tr:last-child td { border-bottom: none; }
    .picks-table tr:hover td { background: #1c2128; }
    .result-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .result-pill.win { background: #0f2a1a; color: #3fb950; border: 1px solid #2ea04355; }
    .result-pill.loss { background: #1a0f0f; color: #f85149; border: 1px solid #6e101055; }
    .result-pill.push { background: #1c2128; color: #8b949e; border: 1px solid #30363d; }
    .result-pill.pending { background: #1a1a0a; color: #d29922; border: 1px solid #6b5b0055; }

    .history-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 14px;
      background: #161b22;
      border: 1px solid #30363d;
      color: #8b949e;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .filter-btn.active {
      background: #1f6feb22;
      border-color: #58a6ff;
      color: #58a6ff;
    }

    @media (max-width: 600px) {
      .picks-table { font-size: 10px; }
      .picks-table th, .picks-table td { padding: 6px 8px; }
      .summary-value { font-size: 20px; }
    }

    @media (max-width: 500px) {
      .games-grid { grid-template-columns: 1fr; }
      .tabs { padding: 12px 16px 0; }
      .tab { padding: 8px 12px; font-size: 12px; }
      .controls { padding: 12px 16px; }
      .content { padding: 0 16px 16px; }
      header { padding: 12px 16px; }
      .movement-table { font-size: 11px; }
      .movement-table th, .movement-table td { padding: 4px; }
    }
  </style>
</head>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('nba', this)">🏀 NBA</button>
    <button class="tab" onclick="switchTab('nhl', this)">🏒 NHL</button>
    <button class="tab" onclick="switchTab('nfl', this)">🏈 NFL</button>
    <button class="tab" onclick="switchTab('mlb', this)">⚾ MLB</button>
    <button class="tab" onclick="switchTab('pool', this)">🎯 Pick 6</button>
    <button class="tab" onclick="switchTab('history', this)">📊 History</button>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="fetch-btn" onclick="fetchPredictions()">Fetch Predictions</button>
    <span class="refresh-info" id="refresh-info">Click to load predictions with live betting lines</span>
  </div>

  <div class="content" id="content">
    <div class="no-games">Select a sport tab and click Fetch Predictions to begin.</div>
  </div>

  <script>
    let currentSport = 'nba';
    let cache = {};

    // Auto-refresh budget. The Odds API free tier is 500 requests/month and each
    // prediction fetch costs ~3, so an uncapped loop in a tab left open all day
    // would drain the entire month in well under 24 hours. Refresh now skips
    // while the tab is hidden and stops after AUTO_REFRESH_MAX cycles; clicking
    // Fetch Predictions resets the budget.
    const AUTO_REFRESH_MS = 15 * 60 * 1000;
    const AUTO_REFRESH_MAX = 8;
    let autoRefreshCount = 0;
    let autoRefreshTimer = null;

    function scheduleAutoRefresh(sportOfLastFetch) {
      clearTimeout(autoRefreshTimer);
      if (autoRefreshCount >= AUTO_REFRESH_MAX) {
        document.getElementById('refresh-info').textContent =
          'Auto-refresh paused to protect API quota. Click Fetch Predictions to resume.';
        return;
      }
      autoRefreshTimer = setTimeout(() => {
        if (currentSport !== sportOfLastFetch) return;
        // Hidden tab: reschedule without spending a request.
        if (document.hidden) { scheduleAutoRefresh(sportOfLastFetch); return; }
        autoRefreshCount++;
        fetchPredictions(true);
      }, AUTO_REFRESH_MS);
    }
    let historyFilter = null; // null = all, 'nba', 'nhl', 'mlb'

    function switchTab(sport, el) {
      currentSport = sport;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');

      const fetchBtn = document.getElementById('fetch-btn');
      const refreshInfo = document.getElementById('refresh-info');

      if (sport === 'pool') {
        fetchBtn.style.display = 'none';
        refreshInfo.textContent = 'Score your pool lines against the current market';
        loadPool();
        return;
      }

      if (sport === 'history') {
        // History tab: hide the fetch button, load history immediately
        fetchBtn.style.display = 'none';
        refreshInfo.textContent = 'Pick history and W/L tracking';
        loadHistory();
        return;
      }

      // Sport tab: show the fetch button
      fetchBtn.style.display = '';
      refreshInfo.textContent = 'Click to load predictions with live betting lines';

      if (cache[sport]) {
        renderGames(cache[sport]);
      } else {
        document.getElementById('content').innerHTML = '<div class="no-games">Click Fetch Predictions to load ' + sport.toUpperCase() + ' data.</div>';
      }
    }

    async function fetchPredictions(isAuto) {
      // A manual click resets the auto-refresh budget; an auto cycle does not.
      if (!isAuto) { autoRefreshCount = 0; }
      const btn = document.getElementById('fetch-btn');
      const info = document.getElementById('refresh-info');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      info.textContent = 'Fetching live data & running predictions...';

      document.getElementById('content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>Analyzing ${currentSport.toUpperCase()} games with live odds...</div>
        </div>`;

      try {
        const res = await fetch('/api/predictions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sport: currentSport })
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // DEBUG: Log the full response
        console.log('API Response:', data);
        if (data.games && data.games.length > 0) {
          console.log('First game:', data.games[0]);
          console.log('Line movement:', data.games[0].lineMovement);
          console.log('Sharp signals:', data.games[0].sharpSignals);
        }

        cache[currentSport] = data;
        renderGames(data);
        document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
        info.textContent = `Loaded ${data.games?.length || 0} games`;

        scheduleAutoRefresh(data.sport?.toLowerCase());

      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
        info.textContent = 'Error loading data. Try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch Predictions';
      }
    }

    function safeNum(val) {
      const num = parseFloat(val);
      return isNaN(num) ? null : num;
    }

    function formatEdge(val) {
      if (val === null || val === undefined) return 'N/A';
      const num = parseFloat(val);
      if (isNaN(num)) return 'N/A';
      return (num > 0 ? '+' : '') + num.toFixed(1) + '%';
    }

    function formatKelly(val) {
      if (val === null || val === undefined) return '0%';
      const num = parseFloat(val);
      if (isNaN(num)) return '0%';
      return num.toFixed(1) + '%';
    }

    function edgeClass(val) {
      const num = safeNum(val);
      if (num === null) return 'neutral';
      if (num > 1) return 'positive';
      if (num < -1) return 'negative';
      return 'neutral';
    }

    // A card is worth flagging when the book being bet at is offering a better
    // NUMBER than the rest of the market. That is a fact about prices. The old
    // version flagged a model edge of 3% or more, which after measurement is
    // noise dressed as a recommendation.
    function hasBookValue(game) {
      return Number(game.bookValuePts || 0) > 0;
    }

    // Format a single number for the movement table — handles null, plus signs, etc.
    function fmtNum(val, withPlus) {
      if (val === null || val === undefined || isNaN(val)) return '—';
      const num = parseFloat(val);
      if (withPlus && num > 0) return '+' + num;
      return String(num);
    }

    // Format a movement value with color and arrow
    // The server runs in UTC, so anything it formats is on the wrong date for
    // most readers — a 6pm kickoff came back as tomorrow. Format from the raw
    // ISO instead; the browser knows the timezone and the server never can.
    function fmtKickoff(game) {
      const iso = game.startTime;
      if (!iso) return game.gameTime || '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return game.gameTime || '';
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      return sameDay ? `Today ${time}`
        : `${d.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' })} ${time}`;
    }

    function fmtMovement(val) {
      // Unknown and unmoved are different facts. Showing "no move" for a
      // missing opening line is how a broken feed reads as a real measurement.
      if (val === null || val === undefined || isNaN(val)) {
        return { text: 'n/a', cls: 'move-flat' };
      }
      if (val === 0) {
        return { text: 'no move', cls: 'move-flat' };
      }
      const num = parseFloat(val);
      if (num > 0) return { text: '↑ +' + num.toFixed(1), cls: 'move-up' };
      return { text: '↓ ' + num.toFixed(1), cls: 'move-down' };
    }

    // ========================================================================
    // NEW: Render the full-detail line movement section
    // Shows: market | open | current | movement, plus sharp signals below
    // ========================================================================
    function renderLineMovement(game) {
      const lm = game.lineMovement;
      if (!lm) return '';

      // Bail if we don't have any meaningful data
      const hasSpread = lm.openSpread !== null && lm.openSpread !== undefined;
      const hasTotal = lm.openTotal !== null && lm.openTotal !== undefined;
      const hasML = lm.homeML !== null && lm.homeML !== undefined;
      if (!hasSpread && !hasTotal && !hasML) return '';

      const bookmakerLabel = game.bookmaker ? `via ${game.bookmaker}` : 'via ESPN/DraftKings';

      let rows = '';

      if (hasSpread) {
        const spreadMov = fmtMovement(lm.spreadMovement);
        rows += `
          <tr>
            <td class="market-name">Spread</td>
            <td class="num-cell">${fmtNum(lm.openSpread, true)}</td>
            <td class="num-cell">${fmtNum(lm.currentSpread, true)}</td>
            <td class="num-cell ${spreadMov.cls}">${spreadMov.text}</td>
          </tr>`;
      }

      if (hasTotal) {
        const totalMov = fmtMovement(lm.totalMovement);
        rows += `
          <tr>
            <td class="market-name">Total</td>
            <td class="num-cell">${fmtNum(lm.openTotal)}</td>
            <td class="num-cell">${fmtNum(lm.currentTotal)}</td>
            <td class="num-cell ${totalMov.cls}">${totalMov.text}</td>
          </tr>`;
      }

      // Money lines: we only have current from ESPN scrape, not opening — show as a single row
      if (hasML) {
        rows += `
          <tr>
            <td class="market-name">ML (current)</td>
            <td class="num-cell" colspan="2">Home ${fmtNum(lm.homeML, true)} / Away ${fmtNum(lm.awayML, true)}</td>
            <td class="move-flat">—</td>
          </tr>`;
      }

      // Sharp signals section
      let signalsHTML = '';
      if (game.sharpSignals && game.sharpSignals.length > 0) {
        // Described as history, not advice. Backing the side a line moved
        // toward, at the CURRENT price, went 48.1% over 269 games of 2025 —
        // below break-even, because the move is already in the price offered.
        // The same bet against a number set before the move went 63% when the
        // move was 2+ points. So what matters is which number you hold, and the
        // wording has to leave that to the reader rather than shout at them.
        signalsHTML = '<div class="sharp-signals">';
        game.sharpSignals.forEach(sig => {
          const icon = sig.magnitude === 'strong' ? '📉' : '·';
          const moveStr = sig.movement > 0 ? '+' + sig.movement : sig.movement;
          signalsHTML += `
            <div class="sharp-signal-item ${sig.magnitude}">
              <span class="sharp-icon">${icon}</span>
              <span><strong>${sig.market} moved ${moveStr}</strong> ${sig.direction} since open.
                ${sig.magnitude === 'strong'
                  ? 'A line set before this is now well behind the market.'
                  : 'A line set before this is slightly behind the market.'}</span>
            </div>`;
        });
        signalsHTML += '</div>';
      }

      return `
        <div class="movement-section">
          <div class="movement-title">
            <span>📈 Line Movement (Open → Current)</span>
            <span style="color:#6e7681; font-size:10px; text-transform:none;">${bookmakerLabel}</span>
          </div>
          <table class="movement-table">
            <thead>
              <tr>
                <th>Market</th>
                <th>Open</th>
                <th>Current</th>
                <th>Move</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
          ${signalsHTML}
        </div>`;
    }


    function renderGames(data) {
      const games = data.games || [];

      if (!games.length) {
        document.getElementById('content').innerHTML = '<div class="no-games">No games found for today.</div>';
        return;
      }

      const html = games.map(g => {
        const valueBet = hasBookValue(g);

        let weatherBadge = '';
        if (g.weather) {
          weatherBadge = `<span class="weather-badge">🌡️ ${g.weather.temperature}°F ${g.weather.windSpeed}mph</span>`;
        }

        const favoriteTeam = g.favorite || '';
        const homeIsFavorite = favoriteTeam.includes(g.homeTeam?.split(' ').pop());

        // NEW: Full-detail line movement section (replaces old movementHTML)
        const movementHTML = renderLineMovement(g);

        // The number shown first is the one at the book being bet at, because
        // that is the number actually available. Consensus sits underneath as
        // the reference for whether it is a good one. When they differ, the
        // side that benefits is named — a spread of -2.5 against a consensus of
        // -3.5 is a point in the home backer's favour and a point against the
        // away backer, so "better" on its own would be meaningless.
        const mb = g.myBook || null;
        const shortName = (full) => (full || '').split(' ').pop();

        function lineCell(label, bookVal, marketVal, beneficiary, favClass) {
          const shown = bookVal ?? marketVal ?? 'N/A';
          let sub = '';
          if (bookVal !== null && bookVal !== undefined &&
              marketVal !== null && marketVal !== undefined) {
            sub = bookVal === marketVal
              ? '<div class="line-sub">at market</div>'
              : `<div class="line-sub better">mkt ${marketVal} &middot; ${beneficiary}</div>`;
          }
          return `<div class="line-item"><div class="line-label">${label}</div>` +
            `<div class="line-value ${favClass || ''}">${shown}</div>${sub}</div>`;
        }

        // Whichever side the book's number favours, and by how much.
        const spreadBeneficiary = (() => {
          if (!mb || mb.spread === null || g.spread === null) return '';
          const home = mb.homeEdgePts, away = mb.awayEdgePts;
          if (home > 0) return `+${home} ${shortName(g.homeTeam)}`;
          if (away > 0) return `+${away} ${shortName(g.awayTeam)}`;
          return '';
        })();
        const totalBeneficiary = (() => {
          if (!mb || mb.total === null || g.total === null) return '';
          if (mb.overEdgePts > 0) return `+${mb.overEdgePts} over`;
          if (mb.underEdgePts > 0) return `+${mb.underEdgePts} under`;
          return '';
        })();

        const bookLabel = mb ? mb.name : 'Market';
        // For baseball and hockey the line is 1.5 on every game, so comparing
        // that number against consensus says nothing and the row above always
        // reads "at market". What actually varies is the price, and this is
        // what the moneyline on the SAME game at the SAME book says that price
        // should be. Shown whether or not it is trusted enough to bet on,
        // because the comparison is worth reading either way.
        let runLineHTML = '';
        if (g.runLine) {
          const rl = g.runLine;
          const sign = (n) => `${n > 0 ? '+' : ''}${Math.round(n)}`;
          const cell = (team, offered, fair, edge) => {
            const cls = edge >= 1 ? 'rl-good' : edge <= -1 ? 'rl-bad' : '';
            return `<div class="rl-item"><div class="rl-team">${team}</div>` +
              `<div class="rl-price ${cls}">${sign(offered)}</div>` +
              `<div class="rl-fair">fair ${sign(fair)} &middot; ${edge > 0 ? '+' : ''}${edge}</div></div>`;
          };
          const away = shortName(g.awayTeam), home = shortName(g.homeTeam);
          runLineHTML = `
            <div class="rl-row">
              <div class="rl-label">What this game's own moneyline says the line is worth</div>
              <div class="rl-cells">
                ${cell(away, rl.offeredAwayPrice, rl.fairAwayPrice, rl.awayEdgePts)}
                ${cell(home, rl.offeredHomePrice, rl.fairHomePrice, rl.homeEdgePts)}
              </div>
            </div>`;
        }

        let linesHTML = `
          ${runLineHTML}
          <div class="lines-row">
            ${lineCell(`Spread &middot; ${bookLabel}`, mb ? mb.spread : g.spread, g.spread, spreadBeneficiary, '')}
            ${lineCell(`Total &middot; ${bookLabel}`, mb ? mb.total : g.total, g.total, totalBeneficiary, '')}
            <div class="line-item"><div class="line-label">Home ML</div><div class="line-value ${homeIsFavorite ? 'favorite' : ''}">${g.homeML ?? 'N/A'}</div></div>
            <div class="line-item"><div class="line-label">Away ML</div><div class="line-value ${!homeIsFavorite ? 'favorite' : ''}">${g.awayML ?? 'N/A'}</div></div>
          </div>`;

        // No edge chips, no Kelly sizing, no pick chips.
        //
        // Those numbers were real arithmetic, but the input behind them has
        // been tested three ways — opponent-adjusted points, yards per play and
        // EPA — and all three come out indistinguishable from simply taking the
        // market price. Sizing a bet off that, or labelling it a "value bet",
        // asserts an advantage that does not survive measurement.
        //
        // What remains on this tab is information that is true: the number at
        // the book being used, how it compares with the rest of the market, how
        // far the line has moved, injuries, quarterback and weather. The one
        // place that still recommends anything is the Pick 6 tab, where the
        // edge comes from a stale line rather than a forecast.
        const factors = (g.keyFactors || []).map(f => `<div class="factor-item">${f}</div>`).join('');

        // INJURY REPORT — collapsed by default.
        //
        // It used to print every player on both sides inline, which on a
        // baseball card is twenty-odd rows and buries everything else. Now the
        // headline is a one-line count and the names are behind a disclosure
        // triangle, so a card stays readable and the detail is one tap away.
        //
        // Long-term absences sit at the bottom and are dimmed. A player on the
        // 60-day IL has been out for months and is in every price already; the
        // useful part of this report is who is newly unavailable.
        let injuriesHTML = '';
        {
          const home = (g.stats && g.stats.injuries && g.stats.injuries.home) || [];
          const away = (g.stats && g.stats.injuries && g.stats.injuries.away) || [];

          if (home.length || away.length) {
            const isOut = (i) => i.level === 'out' && !i.longTerm;
            const isDoubt = (i) => i.level === 'doubtful';
            const all = home.concat(away);
            const outNow = all.filter(isOut).length;
            const doubtful = all.filter(isDoubt).length;
            const questionable = all.filter(i => i.level === 'questionable').length;
            const longTerm = all.filter(i => i.longTerm).length;

            // Say what is actually news, and only mention the rest as a count.
            const bits = [];
            if (outNow) bits.push(`<span class="inj-out">${outNow} out</span>`);
            if (doubtful) bits.push(`<span class="inj-doubt">${doubtful} doubtful</span>`);
            if (questionable) bits.push(`<span class="inj-quest">${questionable} questionable</span>`);
            if (longTerm) bits.push(`<span class="inj-long">${longTerm} long term</span>`);
            const summary = bits.length ? bits.join(' &middot; ') : 'none listed';

            const row = (i) => {
              const cls = i.longTerm ? 'inj-long' : i.level === 'out' ? 'inj-out'
                : i.level === 'doubtful' ? 'inj-doubt' : 'inj-quest';
              return `<div class="inj-row${i.longTerm ? ' inj-dim' : ''}">` +
                `<span class="inj-status ${cls}">${i.status}</span>` +
                `<span class="inj-name">${i.player}</span>` +
                `<span class="inj-pos">${i.position || ''}</span>` +
                `<span class="inj-type">${i.type || ''}</span></div>`;
            };

            const side = (label, list) => list.length
              ? `<div class="inj-team">${label}</div>${list.map(row).join('')}`
              : '';

            injuriesHTML = `
              <details class="inj-box">
                <summary class="inj-summary">🏥 Injuries <span class="inj-counts">${summary}</span></summary>
                <div class="inj-body">
                  ${side(g.awayTeam, away)}
                  ${side(g.homeTeam, home)}
                </div>
              </details>`;
          }
        }

        return `
          <div class="game-card ${valueBet ? 'value-bet' : ''}">
            <div class="card-header">
              <div>
                <div class="teams">${g.awayTeam} @ ${g.homeTeam}</div>
                <div class="game-time">${
                  g.inProgress ? '<span style="color:#f0883e">● In progress</span> &middot; ' : ''
                }${fmtKickoff(g)}</div>
              </div>
              <div class="header-badges">
                ${weatherBadge}
                <span class="confidence ${g.confidence}">${
                  g.inProgress ? 'live'
                    : (g.bookValuePts > 0
                        ? `+${g.bookValuePts} pt${g.bookValuePts === 1 ? '' : 's'} at ${(g.myBook && g.myBook.name) || 'your book'}`
                        : 'market price')}</span>
              </div>
            </div>
            <div class="card-body">
              ${(() => {
                // Show the best available side, not just whether an edge
                // exists. A lean is styled differently from an edge on purpose:
                // one is a price fact, the other is a tiebreaker for someone
                // betting regardless, and they must not read alike.
                const r = g.bestBet || g.recommendation;
                if (!r) return '';
                // The pool note sits with the verdict because the two are easy
                // to confuse and mean opposite things: movement is an edge
                // against a frozen line and nothing against a live one.
                const pf = g.poolFlag
                  ? `<div class="pool-flag">Pick 6: the line has moved ${g.poolFlag.points} pt${g.poolFlag.points === 1 ? '' : 's'} since it opened — ${
                      g.poolFlag.level === 'strong' ? 'strong candidate if your pool number is still the old one' : 'worth checking your pool number'}.</div>`
                  : '';
                // Situation flags sit with the verdict because they are the
                // reason to look past it: the verdict grades price, a flag says
                // the price may not have caught up with what is known.
                const flags = (g.situationFlags || []).map(f =>
                  `<div class="sit-flag ${f.severity}">${f.note}</div>`).join('');
                return `<div class="verdict ${r.level}">
                  <span class="verdict-label">${r.label}</span>
                  ${r.pick ? `<span class="verdict-pick">${r.pick}</span>` : ''}
                  <span class="verdict-reason">${r.reason}</span>
                  ${r.caveat ? `<div class="verdict-caveat">${r.caveat}</div>` : ''}
                  ${flags}
                  ${pf}
                </div>`;
              })()}
              ${g.assessment ? `<div class="assessment">${g.assessment}</div>` : ''}
              ${linesHTML}
              ${movementHTML}
              <div class="prediction-row">
                <div class="pred-label">Predicted Score</div>
                <div class="pred-score">${g.awayTeam?.split(' ').pop()} ${g.predictedScore?.away ?? '?'} — ${g.predictedScore?.home ?? '?'} ${g.homeTeam?.split(' ').pop()}</div>
              </div>
              ${factors ? `<div class="factors"><div class="factors-label">Key Factors</div>${factors}</div>` : ''}
              ${injuriesHTML}
            </div>
          </div>`;
      }).join('');

      document.getElementById('content').innerHTML = `<div class="games-grid">${html}</div>`;
    }

    // ========================================================================
    // HISTORY TAB
    // ========================================================================

    // ---------------------------------------------------------------------
    // PICK 6
    // ---------------------------------------------------------------------
    // A weekly pool freezes its lines; the market does not. By kickoff the two
    // can be several points apart, and the gap is the edge — backing the side
    // the market moved toward, at the frozen number, went 84-56 across 2024 and
    // 2025 when the move was two points or more.
    //
    // 2025 is where the rule was found; 2024 is a holdout it was never fitted
    // to and it replicated there at every threshold. The control, backing home
    // at the opening number regardless of direction, is 50.3%.
    //
    // No model opinion is involved. The market is treated as the truth and the
    // pool line is scored against it, which is the opposite of what the rest of
    // this app does and the reason it actually works.
    let poolGames = [];
    const POOL_KEY = 'poolLines:nfl';

    const savedPoolLines = () => {
      try { return JSON.parse(localStorage.getItem(POOL_KEY) || '{}'); } catch (e) { return {}; }
    };
    function persistPoolLines() {
      const out = {};
      for (const g of poolGames) {
        const sp = document.getElementById('ps-' + g.id);
        const ap = document.getElementById('pa-' + g.id);
        const tt = document.getElementById('pt-' + g.id);
        const spread = sp && sp.value !== '' ? Number(sp.value) : null;
        const awaySpread = ap && ap.value !== '' ? Number(ap.value) : null;
        const total = tt && tt.value !== '' ? Number(tt.value) : null;
        if (spread !== null || awaySpread !== null || total !== null) {
          out[g.id] = { spread, awaySpread, total };
        }
      }
      try { localStorage.setItem(POOL_KEY, JSON.stringify(out)); } catch (e) { /* ignore */ }
      return out;
    }

    // Most pool lines are two-sided, so the away number mirrors the home one and
    // typing it twice would be busywork. It auto-fills until it is edited by
    // hand, and then it is left alone — which is the case that matters, because
    // a tight game gets -2 against -2 with no plus money on either side.
    function mirrorAway(id) {
      const home = document.getElementById('ps-' + id);
      const away = document.getElementById('pa-' + id);
      if (!home || !away) return;
      if (away.dataset.touched !== '1') {
        away.value = home.value === '' ? '' : String(-Number(home.value));
      }
      persistPoolLines();
    }
    function markAwayTouched(id) {
      const away = document.getElementById('pa-' + id);
      if (away) away.dataset.touched = '1';
      persistPoolLines();
    }

    async function loadPool() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading this week&rsquo;s games and market lines...</div></div>';
      try {
        const res = await fetch('/api/pool/nfl');
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        poolGames = data.games || [];
        renderPool();
      } catch (err) {
        content.innerHTML = `<div class="error">❌ ${err.message}</div>`;
      }
    }

    function renderPool() {
      const saved = savedPoolLines();
      if (!poolGames.length) {
        document.getElementById('content').innerHTML =
          '<div class="no-games">No upcoming NFL games in the next week.</div>';
        return;
      }
      const rows = poolGames.map(g => {
        const v = saved[g.id] || {};
        // Both teams laying points is the pool's own format for a tight game,
        // and it is worth marking because those are the worst picks available.
        const bothLay = Number.isFinite(v.spread) && Number.isFinite(v.awaySpread) &&
                        Math.abs(v.spread + v.awaySpread) > 1e-9;
        const ms = g.marketSpread === null ? '—' : (g.marketSpread > 0 ? '+' + g.marketSpread : g.marketSpread);
        const mt = g.marketTotal === null ? '—' : g.marketTotal;
        return `
          <tr>
            <td>${g.awayTeam} @ <strong>${g.homeTeam}</strong><div class="pool-market">${g.gameTime}</div></td>
            <td class="pool-market">${ms}</td>
            <td><input id="ps-${g.id}" type="number" step="0.5" placeholder="—"
                       value="${v.spread ?? ''}" oninput="mirrorAway('${g.id}')"></td>
            <td><input id="pa-${g.id}" type="number" step="0.5" placeholder="—"
                       class="${bothLay ? 'pool-bothlay' : ''}"
                       data-touched="${v.awaySpread !== null && v.awaySpread !== undefined ? '1' : '0'}"
                       value="${v.awaySpread ?? (v.spread !== null && v.spread !== undefined ? -v.spread : '')}"
                       oninput="markAwayTouched('${g.id}')"></td>
            <td class="pool-market">${mt}</td>
            <td><input id="pt-${g.id}" type="number" step="0.5" placeholder="—"
                       value="${v.total ?? ''}" oninput="persistPoolLines()"></td>
          </tr>`;
      }).join('');

      document.getElementById('content').innerHTML = `
        <div class="pool-note">
          Enter your pool&rsquo;s lines beside the current market number. Each team&rsquo;s
          number goes in its own box, as the pool posts it &mdash; so a normal line is
          <strong>-3</strong> and <strong>+3</strong>, and the away box fills itself in until you
          change it. Your entries are saved in this browser, so you only type them once a week.
          <br><br>
          Where the pool lays points BOTH ways &mdash; <strong>-2</strong> against
          <strong>-2</strong> on a tight game, no plus money anywhere &mdash; type both numbers.
          That is not a spread and it is not priced like one: whichever side you take has to win
          by three, and if the game lands inside two points either way, both picks lose. On an
          even matchup that is roughly a 43% shot with 14% belonging to nobody, where a two-sided
          line would be near 50%. Those are the worst numbers on the board and ranking now says so.
          <br><br>
          Ranking is by win probability rather than the size of the gap, because two points across
          a key number is worth more than three through empty space.
        </div>
        <div style="margin-bottom:14px">
          <button class="btn btn-primary" onclick="rankPool()">Rank my picks</button>
        </div>
        <div id="pool-results"></div>
        <table class="pool-table">
          <thead><tr>
            <th>Game</th><th>Market spread</th><th>Home line</th><th>Away line</th>
            <th>Market total</th><th>Your total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    async function rankPool() {
      const lines = persistPoolLines();
      const target = document.getElementById('pool-results');
      if (!Object.keys(lines).length) {
        target.innerHTML = '<div class="pool-note">Enter at least one of your pool&rsquo;s lines first.</div>';
        return;
      }
      target.innerHTML = '<div class="loading"><div class="spinner"></div><div>Scoring against the market...</div></div>';
      try {
        const res = await fetch('/api/pool/nfl', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lines, count: 6 }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (!data.best || !data.best.length) {
          target.innerHTML = '<div class="pool-note">Nothing to rank yet — the market has no line for those games.</div>';
          return;
        }
        target.innerHTML = `
          <h3 style="margin:0 0 10px">Best ${data.best.length} of ${data.considered}</h3>
          ${data.best.map(b => `
            <div class="pool-pick ${b.gap >= 2 ? 'strong' : ''}">
              <div class="headline">${b.pick}
                <span style="color:#8b949e;font-weight:400"> — ${(b.winProb * 100).toFixed(1)}%</span></div>
              <div class="detail">${b.matchup}</div>
              <div class="detail">
                your line ${b.poolLine} &middot; market ${b.marketLine} &middot;
                ${b.gap} pt${b.gap === 1 ? '' : 's'} stale${b.pushProb > 0.005
                  ? ` &middot; ${(b.pushProb * 100).toFixed(1)}% push risk` : ''}
              </div>
            </div>`).join('')}
          <div class="pool-note" style="margin-top:12px">
            Percentages come from treating the current market number as the expected result and
            pricing your frozen line against it. Measured over 269 games of 2025, the two-point-plus
            bucket went 46-27 &mdash; 73 games from one season, with the threshold chosen after the
            results were in. So it was re-run on 2024, a season it had never been fitted to, with
            the rule unchanged: a one-point move went 53.5%, two points 56.7%, three points 63.3%.
            Every threshold still clears the 52.4% needed to break even. Across both seasons a
            two-point move is 84-56, 60.0%, and the control &mdash; backing the home side at the
            opening number whichever way the market moved &mdash; is 50.3%, so it is the direction
            of the move doing the work.
            2024 on its own is about one standard deviation, so treat this as corroborated rather
            than proven. About 26% of games move two points or more and 60% move at least one, so a
            full slate usually offers four or five of the first and plenty of the second.</div>`;
      } catch (err) {
        target.innerHTML = `<div class="error">❌ ${err.message}</div>`;
      }
    }

    async function loadHistory() {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>Loading pick history...</div>
        </div>`;

      try {
        const url = historyFilter ? `/api/history?sport=${historyFilter}` : '/api/history';
        const res = await fetch(url);
        if (!res.ok) throw new Error('Server error: ' + res.status);
        const data = await res.json();

        if (!data.available) {
          content.innerHTML = `
            <div class="no-games">
              📊 Pick tracking is not available yet.<br><br>
              <span style="font-size: 13px;">${data.message || 'The database is not configured or no picks have been recorded yet. Make some predictions and check back!'}</span>
            </div>`;
          return;
        }

        renderHistory(data);
      } catch (err) {
        content.innerHTML = `<div class="error">❌ Error loading history: ${err.message}</div>`;
      }
    }

    function setHistoryFilter(filter, el) {
      historyFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      loadHistory();
    }

    function pctClass(wins, losses) {
      const total = wins + losses;
      if (total === 0) return 'neutral';
      const pct = wins / total;
      if (pct >= 0.55) return 'good';
      if (pct < 0.50) return 'bad';
      return 'neutral';
    }

    function fmtRecord(wins, losses, pushes) {
      wins = parseInt(wins) || 0;
      losses = parseInt(losses) || 0;
      pushes = parseInt(pushes) || 0;
      const total = wins + losses;
      const pct = total > 0 ? ((wins / total) * 100).toFixed(1) : '0.0';
      const recordStr = pushes > 0 ? `${wins}-${losses}-${pushes}` : `${wins}-${losses}`;
      return { record: recordStr, pct, cls: pctClass(wins, losses) };
    }

    function renderHistory(data) {
      const overall = data.overall || {};
      const wins = parseInt(overall.wins) || 0;
      const losses = parseInt(overall.losses) || 0;
      const pushes = parseInt(overall.pushes) || 0;
      const pending = parseInt(overall.pending) || 0;
      const total = wins + losses;
      const winPct = total > 0 ? ((wins / total) * 100).toFixed(1) : '0.0';

      // Rough profit calculation: assumes -110 juice on all bets, $100 unit
      // Win = +$90.91, Loss = -$100, Push = $0
      const unitProfit = (wins * 90.91) - (losses * 100);
      const profitColor = unitProfit > 0 ? '#3fb950' : unitProfit < 0 ? '#f85149' : '#8b949e';

      // Filter buttons
      const filtersHTML = `
        <div class="history-filters">
          <button class="filter-btn ${historyFilter === null ? 'active' : ''}" onclick="setHistoryFilter(null, this)">All Sports</button>
          <button class="filter-btn ${historyFilter === 'nba' ? 'active' : ''}" onclick="setHistoryFilter('nba', this)">🏀 NBA</button>
          <button class="filter-btn ${historyFilter === 'nhl' ? 'active' : ''}" onclick="setHistoryFilter('nhl', this)">🏒 NHL</button>
          <button class="filter-btn ${historyFilter === 'mlb' ? 'active' : ''}" onclick="setHistoryFilter('mlb', this)">⚾ MLB</button>
        </div>`;

      // Summary cards
      const summaryHTML = `
        <div class="history-summary">
          <div class="summary-card">
            <div class="summary-label">Overall Record</div>
            <div class="summary-value">${wins}-${losses}${pushes > 0 ? '-' + pushes : ''}</div>
            <div class="summary-sub">${total} graded picks</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Win Rate</div>
            <div class="summary-value ${parseFloat(winPct) >= 52.4 ? 'win-rate' : 'loss-rate'}">${winPct}%</div>
            <div class="summary-sub">52.4% needed at -110</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Pending</div>
            <div class="summary-value pending">${pending}</div>
            <div class="summary-sub">awaiting results</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">Profit (per $100 unit)</div>
            <div class="summary-value" style="color: ${profitColor};">${unitProfit >= 0 ? '+' : ''}$${unitProfit.toFixed(0)}</div>
            <div class="summary-sub">assumes -110 juice</div>
          </div>
        </div>`;

      // By Market breakdown
      let marketHTML = '';
      if (data.byMarket && data.byMarket.length > 0) {
        const marketCards = data.byMarket.map(m => {
          const r = fmtRecord(m.wins, m.losses, m.pushes);
          return `
            <div class="breakdown-card">
              <div class="breakdown-name">${m.market === 'spread' ? 'Spread / Run Line / Puck Line' : m.market.toUpperCase()}</div>
              <div class="breakdown-record">${r.record}<span class="breakdown-pct ${r.cls}">${r.pct}%</span></div>
            </div>`;
        }).join('');
        marketHTML = `
          <div class="history-section">
            <div class="history-section-title">Performance by Market</div>
            <div class="breakdown-grid">${marketCards}</div>
          </div>`;
      }

      // By Confidence breakdown
      let confidenceHTML = '';
      if (data.byConfidence && data.byConfidence.length > 0) {
        const order = { 'High': 0, 'Medium': 1, 'Low': 2 };
        const sorted = [...data.byConfidence].sort((a, b) => (order[a.confidence] ?? 99) - (order[b.confidence] ?? 99));
        const confCards = sorted.map(c => {
          const r = fmtRecord(c.wins, c.losses, c.pushes);
          return `
            <div class="breakdown-card">
              <div class="breakdown-name">${c.confidence || 'Unknown'} Confidence</div>
              <div class="breakdown-record">${r.record}<span class="breakdown-pct ${r.cls}">${r.pct}%</span></div>
            </div>`;
        }).join('');
        confidenceHTML = `
          <div class="history-section">
            <div class="history-section-title">Performance by Confidence Level</div>
            <div class="breakdown-grid">${confCards}</div>
          </div>`;
      }

      // Recent picks table
      let recentHTML = '';
      if (data.recent && data.recent.length > 0) {
        const rows = data.recent.map(p => {
          let resultPill;
          if (p.result === 'win') resultPill = '<span class="result-pill win">Win</span>';
          else if (p.result === 'loss') resultPill = '<span class="result-pill loss">Loss</span>';
          else if (p.result === 'push') resultPill = '<span class="result-pill push">Push</span>';
          else resultPill = '<span class="result-pill pending">Pending</span>';

          const dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString() : '';
          const matchup = `${(p.away_team || '').split(' ').pop()} @ ${(p.home_team || '').split(' ').pop()}`;
          const finalScore = (p.actual_home !== null && p.actual_away !== null)
            ? `${p.actual_away}-${p.actual_home}`
            : '—';
          const edgeStr = p.edge !== null ? (parseFloat(p.edge) > 0 ? '+' : '') + parseFloat(p.edge).toFixed(1) + '%' : '—';

          return `
            <tr>
              <td>${dateStr}</td>
              <td>${(p.sport || '').toUpperCase()}</td>
              <td>${matchup}</td>
              <td>${p.market || ''}</td>
              <td><strong>${p.pick || ''}</strong></td>
              <td>${edgeStr}</td>
              <td>${p.confidence || ''}</td>
              <td>${finalScore}</td>
              <td>${resultPill}</td>
            </tr>`;
        }).join('');

        recentHTML = `
          <div class="history-section">
            <div class="history-section-title">Recent Picks (Last 50)</div>
            <table class="picks-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Sport</th>
                  <th>Matchup</th>
                  <th>Market</th>
                  <th>Pick</th>
                  <th>Edge</th>
                  <th>Conf</th>
                  <th>Final</th>
                  <th>Result</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;
      } else {
        recentHTML = `
          <div class="no-games">
            No picks recorded yet. Once you fetch predictions for NBA, NHL, or MLB games with edges, they'll appear here and get graded automatically when games finish.
          </div>`;
      }

      document.getElementById('content').innerHTML = filtersHTML + summaryHTML + marketHTML + confidenceHTML + recentHTML;
    }
  </script>
</body>
</html>
